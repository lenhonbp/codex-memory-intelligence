name: Apply v0.11 ambient patch

on:
  push:
    branches:
      - feat/v0.11-ambient-agent-intelligence
    paths:
      - .github/workflows/v011-ambient-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Materialize patch
        shell: bash
        run: |
          python - <<'PY'
          import base64, gzip
          payload = ''''''
          with open('/tmp/apply-v011-ambient-patch.mjs', 'wb') as handle:
              handle.write(gzip.decompress(base64.b64decode(payload)))
          PY
          node --check /tmp/apply-v011-ambient-patch.mjs
      - name: Apply patch
        run: node /tmp/apply-v011-ambient-patch.mjs
      - name: Verify
        run: |
          npm run verify
          npm run benchmark:smoke
          npm run package:smoke
          git diff --check
      - name: Commit implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests docs README.md CHANGELOG.md
          git diff --cached --check
          git commit -m "feat: add ambient agent intelligence"
          git push origin HEAD:feat/v0.11-ambient-agent-intelligence
