name: CMI v0.8 experiential audit

on:
  push:
    branches:
      - audit/v08-experiential-20260807

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false
      - name: Pack exact candidate package surface
        id: pack
        shell: bash
        run: |
          set -euo pipefail
          tarball="$(npm pack --ignore-scripts --silent)"
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"
          npm pack --ignore-scripts --dry-run
      - name: Exercise installed package end to end
        shell: bash
        run: |
          set -euo pipefail
          node scripts/experiential-audit.js "$PWD/${{ steps.pack.outputs.tarball }}"
