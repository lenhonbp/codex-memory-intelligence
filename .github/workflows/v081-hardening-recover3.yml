name: Recover v0.8.1 compact status patch

on:
  push:
    branches:
      - "v0.8.1/trust-security-hardening"

permissions:
  contents: write

jobs:
  recover:
    if: github.actor == 'lenhonbp'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: "24.9.0"
          package-manager-cache: false
      - name: Apply corrected hardening patch and verify
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/v081-hardening-apply.yml').read_text()
          start = source.index("          from pathlib import Path\n", source.index("python3 - <<'PY'"))
          end = source.index("\n          PY\n", start)
          script = source[start:end]
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in script.splitlines())
          script = script.replace(
              "''').replace(\"{ recursive: True } if False else { recursive: true }\", \"{ recursive: true }\")",
              "'''.replace(\"{ recursive: True } if False else { recursive: true }\", \"{ recursive: true }\"))",
              1,
          )
          script = script.replace(
              "out, n = re.subn(pattern, repl, text, count=1, flags=flags)",
              "out, n = re.subn(pattern, lambda _match: repl, text, count=1, flags=flags)",
              1,
          )
          old_status_pattern = r'''r"async function countEntries\(filePath\) \{.*?\n\}\n\nexport async function status\(root\) \{.*?\n\}\n\nexport async function doctor"'''
          new_status_pattern = r'''r"async function countEntries\(filePath\).*?\n\nexport async function doctor"'''
          if old_status_pattern not in script:
              raise SystemExit('expected compact-status regex anchor not found')
          script = script.replace(old_status_pattern, new_status_pattern, 1)
          script = script.replace("Path('.github/workflows/v081-hardening-apply.yml').unlink()", "Path('.github/workflows/v081-hardening-apply.yml').unlink(missing_ok=True)")
          Path('/tmp/v081-apply.py').write_text(script)
          PY
          python3 /tmp/v081-apply.py
          rm -f .github/workflows/v081-hardening-recover.yml .github/workflows/v081-hardening-recover2.yml .github/workflows/v081-hardening-recover3.yml
          npm run verify
          npm run benchmark:smoke
          npm run package:smoke
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: harden v0.8.1 evidence and storage trust"
          git push origin HEAD:"v0.8.1/trust-security-hardening"
