name: CMI v0.8.0 exact release-prep experiential audit
on:
  push:
    branches:
      - validation/v080-release-prep-experiential
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout audit harness
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - name: Checkout exact release candidate
        uses: actions/checkout@v6
        with:
          repository: lenhonbp/codex-memory-intelligence
          ref: 76f54a30387bba0819c97a7d4c672528a5d2d136
          path: candidate
          fetch-depth: 1
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false
      - name: Assert exact candidate SHA and pack it
        id: pack
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git -C candidate rev-parse HEAD)"
          test "$actual" = "76f54a30387bba0819c97a7d4c672528a5d2d136"
          tarball="$(cd candidate && npm pack --ignore-scripts --silent)"
          echo "tarball=$PWD/candidate/$tarball" >> "$GITHUB_OUTPUT"
      - name: Primary installed-package experiential audit
        shell: bash
        run: |
          set -euo pipefail
          timeout 300s node scripts/experiential-audit.js "${{ steps.pack.outputs.tarball }}"
      - name: Extended installed-package experiential audit
        shell: bash
        run: |
          set -euo pipefail
          timeout 300s node scripts/experiential-audit-extended.js "${{ steps.pack.outputs.tarball }}"
