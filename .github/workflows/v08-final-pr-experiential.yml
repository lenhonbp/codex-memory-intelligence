name: CMI v0.8.0 exact release-prep experiential audit
on:
  push:
    branches:
      - validation/v080-release-prep-experiential
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout audit harness
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - name: Checkout exact release candidate
        uses: actions/checkout@v6
        with:
          repository: lenhonbp/codex-memory-intelligence
          ref: d3f1e852dadf1c0f2bcb3edde19dd938b47eedfc
          path: candidate
          fetch-depth: 1
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false
      - name: Assert exact candidate SHA and pack it
        id: pack
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git -C candidate rev-parse HEAD)"
          test "$actual" = "d3f1e852dadf1c0f2bcb3edde19dd938b47eedfc"
          tarball="$(cd candidate && npm pack --ignore-scripts --silent)"
          echo "tarball=$PWD/candidate/$tarball" >> "$GITHUB_OUTPUT"
      - name: Make audit harness candidate-version aware
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const file = 'scripts/experiential-audit.js';
          const source = fs.readFileSync(file, 'utf8');
          const from = "assert.equal(cmiRun(['--version']).stdout.trim(), '0.7.0');";
          const to = "assert.equal(cmiRun(['--version']).stdout.trim(), JSON.parse(fs.readFileSync(path.join(installedRoot, 'package.json'), 'utf8')).version);";
          if (!source.includes(from)) throw new Error('expected legacy version assertion not found in audit harness');
          fs.writeFileSync(file, source.replace(from, to));
          NODE
      - name: Primary installed-package experiential audit
        shell: bash
        run: |
          set -euo pipefail
          timeout 300s node scripts/experiential-audit.js "${{ steps.pack.outputs.tarball }}"
      - name: Extended installed-package experiential audit
        shell: bash
        run: |
          set -euo pipefail
          timeout 300s node scripts/experiential-audit-extended.js "${{ steps.pack.outputs.tarball }}"
