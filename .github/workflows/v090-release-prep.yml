name: Prepare CMI v0.9.0 Release

on:
  push:
    branches:
      - v0.9/evidence-integrity

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24.9.0
          package-manager-cache: false
      - name: Apply v0.9.0 release metadata
        run: python3 scripts/_v090_release_prep.py
      - name: Remove release-prep helpers
        run: rm -f scripts/_v090_release_prep.py .github/workflows/v090-release-prep.yml
      - name: Verify release metadata
        run: npm run release:check -- v0.9.0
      - name: Verify repository
        run: npm run verify
      - name: Benchmark incremental intelligence
        run: npm run benchmark:smoke
      - name: Test packed installation
        run: npm run package:smoke
      - name: Validate release-candidate diff
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test "$(node -p "require('./package.json').version")" = "0.9.0"
          grep -q "export const VERSION = '0.9.0'" src/version.js
          grep -q '^## \[0.9.0\] - 2026-08-08$' CHANGELOG.md
          test ! -e scripts/_v090_release_prep.py
          test ! -e .github/workflows/v090-release-prep.yml
      - name: Commit release candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: prepare CMI v0.9.0 release"
          git push origin HEAD:v0.9/evidence-integrity
