name: Implement v0.9.x Real-Repository Evaluation

on:
  push:
    branches:
      - v0.9x/real-repo-evaluation
    paths:
      - .github/workflows/v09x-evaluation-implementation.yml

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24.9.0
          package-manager-cache: false
      - name: Apply evaluation foundation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/_v09x_evaluation_patch.py')
          text = path.read_text(encoding='utf-8')
          old = "function validEnum(value, values) { return values.includes(value); }"
          new = "function validEnum(value, values) { return typeof values?.has === 'function' ? values.has(value) : values.includes(value); }"
          if text.count(old) != 1:
              raise SystemExit(f'expected one validEnum anchor, got {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          python3 scripts/_v09x_evaluation_patch.py
      - name: Remove implementation helpers
        run: rm -f scripts/_v09x_evaluation_patch.py .github/workflows/v09x-evaluation-implementation.yml
      - name: Verify repository
        run: npm run verify
      - name: Benchmark incremental intelligence
        run: npm run benchmark:smoke
      - name: Test packed installation
        run: npm run package:smoke
      - name: Validate unreleased diff discipline
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test "$(node -p "require('./package.json').version")" = "0.9.0"
          grep -q '^## \[Unreleased\]' CHANGELOG.md
          test ! -e scripts/_v09x_evaluation_patch.py
          test ! -e .github/workflows/v09x-evaluation-implementation.yml
          test ! -e .codex-memory
      - name: Commit implementation locally
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add real-repository evaluation foundation"
      - name: Self-host evaluation smoke on clean candidate
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          test -z "$(git ls-files .codex-memory)"
          node src/cli-entry.js scan . --json > "$RUNNER_TEMP/cmi-eval-scan.json"
          node src/cli-entry.js session start "self-host evaluation smoke" --json > "$RUNNER_TEMP/cmi-eval-session-start.json"
          node src/cli-entry.js session close latest --outcome investigated --accomplished "Exercised the evaluation capture path on a clean CMI candidate." --json > "$RUNNER_TEMP/cmi-eval-session-close.json"
          node src/cli-entry.js evaluate capture --source-kind self-host --repository-class cli-tool --task-kind audit --json > "$RUNNER_TEMP/cmi-eval-record.json"
          node src/cli-entry.js evaluate report --json > "$RUNNER_TEMP/cmi-eval-report.json"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const record = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/cmi-eval-record.json', 'utf8'));
          const report = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/cmi-eval-report.json', 'utf8'));
          if (record.source.kind !== 'self-host' || record.source.independent !== false) throw new Error('self-host source classification drifted');
          if (!/^sha256:[0-9a-f]{64}$/.test(record.repository.fingerprint)) throw new Error('repository fingerprint is not anonymized sha256');
          if (report.corpus.externalReal.records !== 0 || report.corpus.externalReal.uniqueRepositories !== 0) throw new Error('self-host evidence leaked into external-real counts');
          if (report.coverage.state !== 'self-host-only') throw new Error(`unexpected self-host coverage state: ${report.coverage.state}`);
          if (JSON.stringify(record).includes('github.com/lenhonbp/codex-memory-intelligence')) throw new Error('raw repository identity leaked into evaluation record');
          NODE
          rm -rf .codex-memory
          test -z "$(git status --porcelain)"
      - name: Push validated implementation
        shell: bash
        run: git push origin HEAD:v0.9x/real-repo-evaluation
