name: Publish package

on:
  push:
    tags:
      - "v*.*.*"
    branches:
      - "release/v*.*.*"

permissions:
  contents: write
  id-token: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.repository == 'lenhonbp/codex-memory-intelligence' &&
      (github.ref_type == 'tag' || github.actor == 'lenhonbp')
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: "24.9.0"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Resolve and guard release target
        id: release
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            tag="$GITHUB_REF_NAME"
            release_branch="false"
          elif [[ "$GITHUB_REF_TYPE" == "branch" && "$GITHUB_REF_NAME" =~ ^release/(v[0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            tag="${BASH_REMATCH[1]}"
            release_branch="true"
            git fetch origin main --depth=1
            main_sha="$(git rev-parse origin/main)"
            if [[ "$GITHUB_SHA" != "$main_sha" ]]; then
              echo "Release branch must point exactly at current main ($main_sha), got $GITHUB_SHA." >&2
              exit 1
            fi
          else
            echo "Unsupported release ref: $GITHUB_REF" >&2
            exit 1
          fi

          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag: $tag" >&2
            exit 1
          fi

          remote_tag_sha="$(git ls-remote origin "refs/tags/$tag" "refs/tags/$tag^{}" | awk '/\^\{\}$/ { peeled=$1 } !/\^\{\}$/ { direct=$1 } END { print peeled ? peeled : direct }')"
          if [[ -n "$remote_tag_sha" && "$remote_tag_sha" != "$GITHUB_SHA" ]]; then
            echo "Tag $tag already resolves to $remote_tag_sha instead of $GITHUB_SHA." >&2
            exit 1
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "release_branch=$release_branch" >> "$GITHUB_OUTPUT"
          echo "tag_exists=$([[ -n "$remote_tag_sha" ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Verify release metadata
        run: npm run release:check -- "${{ steps.release.outputs.tag }}"

      - name: Verify repository
        run: npm run verify

      - name: Run benchmark smoke test
        run: npm run benchmark:smoke

      - name: Test packed installation
        run: npm run package:smoke

      - name: Create release tag
        if: steps.release.outputs.release_branch == 'true' && steps.release.outputs.tag_exists != 'true'
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          git tag "$RELEASE_TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$RELEASE_TAG"

      - name: Check npm publication state
        id: npm_state
        shell: bash
        run: |
          set -euo pipefail
          package_name="$(node -p "require('./package.json').name")"
          package_version="$(node -p "require('./package.json').version")"
          if npm view "$package_name@$package_version" version --json >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm
        if: steps.npm_state.outputs.published != 'true'
        run: npm publish --access public

      - name: Verify npm publication
        shell: bash
        run: |
          set -euo pipefail
          package_name="$(node -p "require('./package.json').name")"
          package_version="$(node -p "require('./package.json').version")"
          for attempt in 1 2 3 4 5 6; do
            published_version="$(npm view "$package_name@$package_version" version 2>/dev/null || true)"
            if [[ "$published_version" == "$package_version" ]]; then
              exit 0
            fi
            if [[ "$attempt" != "6" ]]; then sleep 5; fi
          done
          echo "npm registry did not report $package_name@$package_version after publication." >&2
          exit 1

      - name: Prepare GitHub release notes
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';

          const tag = process.env.RELEASE_TAG;
          const version = tag.replace(/^v/, '');
          const changelog = fs.readFileSync('CHANGELOG.md', 'utf8');
          const escaped = version.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
          const heading = new RegExp(`^## \\[${escaped}\\].*$`, 'm').exec(changelog);
          if (!heading) throw new Error(`Missing changelog section for ${version}`);
          const afterHeading = changelog.slice(heading.index + heading[0].length);
          const next = afterHeading.search(/^## \[/m);
          const section = (next >= 0 ? afterHeading.slice(0, next) : afterHeading).trim();
          if (!section) throw new Error(`Empty changelog section for ${version}`);
          fs.writeFileSync(path.join(process.env.RUNNER_TEMP, 'release-notes.md'), `${section}\n`);
          NODE

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "GitHub Release $RELEASE_TAG already exists; keeping it unchanged."
          else
            gh release create "$RELEASE_TAG" \
              --verify-tag \
              --title "CMI $RELEASE_TAG" \
              --notes-file "$RUNNER_TEMP/release-notes.md"
          fi

      - name: Remove temporary release branch
        if: success() && steps.release.outputs.release_branch == 'true'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          git push origin --delete "$GITHUB_REF_NAME"
