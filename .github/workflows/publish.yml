name: Publish package

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'lenhonbp/codex-memory-intelligence'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24.9.0"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Verify release metadata
        run: npm run release:check -- "$GITHUB_REF_NAME"

      - name: Verify repository
        run: npm run verify

      - name: Run benchmark smoke test
        run: npm run benchmark:smoke

      - name: Test packed installation
        run: npm run package:smoke

      - name: Publish to npm
        run: npm publish --access public
