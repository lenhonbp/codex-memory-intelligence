name: One-shot CMI graph-drift remediation v2

on:
  push:
    branches:
      - agent/context-aware-graph-drift
    paths:
      - .github/workflows/cmi-graph-remediation-v2.yml

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/context-aware-graph-drift
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Apply remediation script with literal regex replacement
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/cmi-graph-remediation.yml').read_text()
          start_marker = "          python <<'PY'\n"
          end_marker = "          PY\n      - name: Verify remediation"
          start = workflow.find(start_marker)
          end = workflow.find(end_marker)
          if start < 0 or end < 0 or end <= start:
              raise SystemExit('Could not extract remediation Python script from v1 workflow.')
          script = workflow[start + len(start_marker):end]
          lines = script.splitlines()
          if not lines or any(line.startswith('          ') for line in lines if line.strip()):
              # GitHub YAML block content keeps ten spaces in the repository file; strip exactly ten.
              lines = [line[10:] if line.startswith('          ') else line for line in lines]
          script = '\n'.join(lines) + '\n'
          old = "next_text, count = re.subn(pattern, replacement, text, count=1, flags=re.S)"
          new = "next_text, count = re.subn(pattern, lambda _match: replacement, text, count=1, flags=re.S)"
          if script.count(old) != 1:
              raise SystemExit(f'Expected one regex replacement helper target, found {script.count(old)}.')
          script = script.replace(old, new, 1)
          compile(script, '<graph-remediation>', 'exec')
          namespace = {'__name__': '__main__'}
          exec(compile(script, '<graph-remediation>', 'exec'), namespace, namespace)
          PY
      - name: Verify remediation
        run: npm run verify
      - name: Verify package smoke
        run: npm run package:smoke
      - name: Commit remediation
        shell: bash
        run: |
          git config user.name "CMI remediation bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/graph.js src/evidence-health.js src/session-intelligence.js src/closing-intelligence.js src/activation.js tests/session-intelligence.test.js tests/closing-intelligence.test.js docs/CLOSING_INTELLIGENCE.md docs/EVIDENCE_INTEGRITY.md
          git diff --cached --check
          git commit -m "fix: classify expected graph drift as refresh reminder"
          git push origin HEAD:agent/context-aware-graph-drift
