name: Normalize final audit harness
on:
  push:
    branches: [audit/v08-experiential-20260807]
permissions:
  contents: write
jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Normalize audit-only harness and retire exploratory workflows
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/experiential-audit.js')
          s = p.read_text()
          pairs = [
            ("""  async function close() {\n    lines.close();\n    child.kill();\n    await new Promise((resolve) => child.once('close', resolve));\n  }""", """  async function close() {\n    lines.close();\n    if (child.exitCode !== null || child.signalCode !== null) return;\n    const closed = new Promise((resolve) => child.once('close', resolve));\n    child.kill();\n    await Promise.race([closed, new Promise((resolve) => setTimeout(resolve, 1500))]);\n    if (child.exitCode === null && child.signalCode === null) child.kill('SIGKILL');\n  }"""),
            ("""  const stack = (scan.stack || []).map((item) => String(item).toLowerCase());\n  for (const expected of ['javascript', 'typescript', 'python', 'go', 'rust']) assert.ok(stack.some((item) => item.includes(expected)), `missing stack ${expected}: ${stack.join(', ')}`);""", """  const languages = new Set((scan.languages || []).map((item) => String(item.language)));\n  for (const expected of ['JavaScript', 'TypeScript', 'Python', 'Go', 'Rust']) assert.ok(languages.has(expected), `missing indexed language ${expected}: ${[...languages].join(', ')}`);"""),
            ("""  assert.equal(baseline.projectClean ?? baseline.clean, true);\n  assert.ok(!containsText(baseline, root));""", """  assert.ok((baseline.changes || []).every((item) => String(item.path || '').startsWith('.codex-memory')), `unexpected product dirtiness: ${JSON.stringify(baseline.changes)}`);\n  assert.ok(!containsText(baseline, root));"""),
            ("""  cmiRun(['remember', 'fact', sourceMarker, '--source', 'src/util.js']);\n  const search = cmiJson(['search', sourceMarker, '--json']);\n  assert.ok(containsText(search, sourceMarker));\n  const match = findObject(search, (item) => typeof item.id === 'string' && containsText(item, sourceMarker));\n  assert.ok(match?.id, 'search result did not expose a memory id');\n  sourceMemoryId = match.id;""", """  const remembered = cmiRun(['remember', 'fact', sourceMarker, '--source', 'src/util.js']).stdout;\n  sourceMemoryId = remembered.match(/[0-9a-f]{8}/i)?.[0] || null;\n  assert.ok(sourceMemoryId);\n  const search = cmiJson(['search', sourceMarker, '--json']);\n  assert.ok(containsText(search, sourceMarker));"""),
            ("""  cmiRun(['remember', 'decision', inactiveMarker]);\n  const search = cmiJson(['search', inactiveMarker, '--json']);\n  const match = findObject(search, (item) => typeof item.id === 'string' && containsText(item, inactiveMarker));\n  assert.ok(match?.id);\n  inactiveMemoryId = match.id;""", """  const remembered = cmiRun(['remember', 'decision', inactiveMarker]).stdout;\n  inactiveMemoryId = remembered.match(/[0-9a-f]{8}/i)?.[0] || null;\n  assert.ok(inactiveMemoryId);\n  const search = cmiJson(['search', inactiveMarker, '--json']);\n  assert.ok(containsText(search, inactiveMarker));"""),
            ("""  for (const key of ['repository', 'boundaries', 'impact', 'risks', 'verification']) assert.ok(hasKey(brief, key), `prepare output missing ${key}`);""", """  for (const key of ['baseline', 'boundaries', 'impact', 'risks', 'verification']) assert.ok(hasKey(brief, key), `prepare output missing ${key}`);"""),
            ("""await check('clean no-code session chooses source-linked planning continuation and keeps CMI-internal writes out of project dirtiness', async () => {\n  const started = cmiJson(['session', 'start', 'Review what should happen next', '--json']);""", """await check('clean no-code session chooses source-linked planning continuation and keeps CMI-internal writes out of project dirtiness', async () => {\n  cmiJson(['scan', '--json']);\n  const started = cmiJson(['session', 'start', 'Review what should happen next', '--json']);"""),
            ("assert.match(help, /cmi session start/);", "assert.match(help, /cmi session </);"),
            ("assert.match(help, /cmi finding list/);", "assert.match(help, /cmi finding </);"),
          ]
          for old, new in pairs:
              if old not in s: raise SystemExit('normalization snippet missing: ' + old[:100])
              s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          rm -f .github/workflows/v08-experiential-audit.yml .github/workflows/v08-experiential-audit-v2.yml .github/workflows/v08-experiential-audit-v3.yml .github/workflows/v08-experiential-audit-v4.yml .github/workflows/v08-experiential-extended.yml .github/workflows/normalize-v08-audit-harness.yml
      - name: Commit normalized audit head
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'CMI audit automation'
          git config user.email 'audit@users.noreply.github.com'
          git add scripts/experiential-audit.js .github/workflows
          git diff --cached --check
          git commit -m 'test: normalize final experiential audit harness'
          git push origin HEAD:audit/v08-experiential-20260807
