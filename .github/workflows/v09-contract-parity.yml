name: Validate v0.9 Contract Parity

on:
  push:
    branches:
      - v0.9/evidence-integrity

permissions:
  contents: write

jobs:
  correct:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24.9.0
          package-manager-cache: false
      - name: Apply contract parity correction
        run: python3 scripts/_v09_contract_parity_fix.py
      - name: Remove correction helpers
        run: rm -f scripts/_v09_contract_parity_fix.py .github/workflows/v09-contract-parity.yml
      - name: Verify repository
        run: npm run verify
      - name: Benchmark incremental intelligence
        run: npm run benchmark:smoke
      - name: Test packed installation
        run: npm run package:smoke
      - name: Validate final diff discipline
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test "$(node -p "require('./package.json').version")" = "0.8.1"
          test ! -e scripts/_v09_contract_parity_fix.py
          test ! -e .github/workflows/v09-contract-parity.yml
      - name: Commit correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: align v0.9 durable identity contracts"
          git push origin HEAD:v0.9/evidence-integrity
