name: Prepare v0.8.1 release

on:
  push:
    branches:
      - "v0.8.1/trust-security-hardening"

permissions:
  contents: write

jobs:
  prepare:
    if: github.actor == 'lenhonbp'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: "24.9.0"
          package-manager-cache: false
      - name: Apply release metadata and verify
        shell: bash
        run: |
          set -euo pipefail
          node .github/scripts/v081-release-prep.mjs
          npm run release:check -- v0.8.1
          npm run verify
          npm run benchmark:smoke
          npm run package:smoke
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "chore: prepare CMI v0.8.1 release"
          git push origin HEAD:"v0.8.1/trust-security-hardening"
