name: Apply v0.9.x longitudinal evaluation

on:
  push:
    branches:
      - v0.9x/longitudinal-human-evaluation

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: v0.9x/longitudinal-human-evaluation
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Apply longitudinal implementation
        run: python3 scripts/.v09x_longitudinal.py
      - name: Remove temporary implementation helpers
        run: rm -f scripts/.v09x_longitudinal.py .github/workflows/v09x-longitudinal-apply.yml
      - name: Verify repository
        run: npm run verify
      - name: Benchmark smoke
        run: npm run benchmark:smoke
      - name: Packed installation smoke
        run: npm run package:smoke
      - name: Preserve unreleased version discipline
        run: |
          test "$(node -p "require('./package.json').version")" = "0.9.0"
          grep -q '^## \[Unreleased\]' CHANGELOG.md
      - name: Commit validated product tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md README.md ROADMAP.md docs/EVALUATION.md docs/MCP.md schemas/evaluation-record.schema.json schemas/evaluation-bundle.schema.json scripts/quality.js src/evaluation-contracts.js src/evaluation.js src/cli-entry.js src/mcp-entry.js tests/evaluation-longitudinal.test.js tests/evaluation-mcp.test.js
          git diff --cached --check
          git commit -m "feat: add longitudinal human-reviewed evaluation"
      - name: Push validated product tree
        run: git push origin HEAD:v0.9x/longitudinal-human-evaluation
