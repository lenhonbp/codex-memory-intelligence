name: Closing intelligence development patch

on:
  push:
    branches:
      - feat/v0.11-closing-intelligence

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: ${{ startsWith(github.event.head_commit.message, 'RUN_CLOSING_PATCH') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/v0.11-closing-intelligence
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Apply closing-intelligence patch
        run: python3 .github/scripts/closing-intelligence-dev.py
      - name: Repair compatibility and carryover semantics
        run: |
          python3 - <<'PY'
          from pathlib import Path

          closing = Path('src/closing-intelligence.js')
          text = closing.read_text(encoding='utf-8')
          repairs = [
              (
                  'function findingAlert(finding, activeById) {',
                  'function findingAlert(finding, activeById, relatedActiveIds, concurrentActiveIds) {'
              ),
              (
                  "  const carryover = finding.category === 'active-change' && finding.sessionRelevance === 'concurrent-unattributed';",
                  "  const activeChangeId = relatedChangeIds.find((id) => activeById.has(id)) || null;\n  const carryover = finding.category === 'active-change'\n    ? (activeChangeId ? (concurrentActiveIds.has(activeChangeId) || !relatedActiveIds.has(activeChangeId)) : finding.sessionRelevance === 'concurrent-unattributed')\n    : false;"
              ),
              (
                  '    severity: levelForFinding(finding),',
                  "    severity: carryover ? 'reminder' : levelForFinding(finding),"
              ),
              (
                  '  const activeById = new Map(activeChanges.records.map((item) => [item.id, item]));\n  const projectFindings = allFindings.findings.filter((item) => [\'open\', \'accepted\'].includes(item.state));\n  const findingAlerts = projectFindings.map((item) => findingAlert(item, activeById));',
                  "  const activeById = new Map(activeChanges.records.map((item) => [item.id, item]));\n  const relatedActiveIds = new Set((session.close?.handoff?.activeChanges || []).filter((item) => item.relation !== 'sole-active-continuation' || (item.sharedTerms || []).length > 0).map((item) => item.id));\n  const concurrentActiveIds = new Set((session.close?.handoff?.concurrentChanges?.active || []).map((item) => item.id));\n  const projectFindings = allFindings.findings.filter((item) => ['open', 'accepted'].includes(item.state));\n  const findingAlerts = projectFindings.map((item) => findingAlert(item, activeById, relatedActiveIds, concurrentActiveIds));"
              ),
          ]
          for old, new in repairs:
              if text.count(old) != 1:
                  raise SystemExit(f'closing-intelligence repair target count={text.count(old)} for {old[:80]!r}')
              text = text.replace(old, new)
          closing.write_text(text, encoding='utf-8')

          mcp = Path('src/mcp-entry.js')
          text = mcp.read_text(encoding='utf-8')
          repairs = [
              (
                  'append a concise `CMI Intelligence` section with at most three alerts (or CLEAN) so the user can see unresolved cross-session work and evidence-backed consistency reminders without asking.',
                  'append a concise `CMI Intelligence` section with at most three alerts (or CLEAN), including the highest-priority next action, so the user can see unresolved cross-session work and evidence-backed consistency reminders without asking.'
              ),
              (
                  'or the one-line CLEAN state when no material alert exists. Preserve the distinction between observed evidence, reviewed knowledge, historical correlation, and inference.',
                  'or the one-line CLEAN state when no material alert exists. Also surface the highest-priority next action without waiting for the user to ask what to do next. Preserve the distinction between observed evidence, reviewed knowledge, historical correlation, and inference.'
              ),
          ]
          for old, new in repairs:
              if text.count(old) != 1:
                  raise SystemExit(f'mcp compatibility repair target count={text.count(old)} for {old[:80]!r}')
              text = text.replace(old, new)
          mcp.write_text(text, encoding='utf-8')
          PY
      - name: Repair managed-template escaping
        run: |
          python3 - <<'PY'
          from pathlib import Path
          repairs = [
              ('src/activation.js', 'append a concise `### CMI Intelligence` section', 'append a concise \\`### CMI Intelligence\\` section'),
              ('src/mcp-entry.js', 'append a concise `CMI Intelligence` section with at most three alerts', 'append a concise \\`CMI Intelligence\\` section with at most three alerts'),
          ]
          for path, old, new in repairs:
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if text.count(old) != 1:
                  raise SystemExit(f'{path} escaping target count={text.count(old)}')
              p.write_text(text.replace(old, new), encoding='utf-8')
          PY
      - name: Syntax-check changed source
        run: |
          node --check src/closing-intelligence.js
          node --check src/activation.js
          node --check src/cli-entry.js
          node --check src/mcp-entry.js
      - name: Verify repository
        run: npm run verify
      - name: Benchmark smoke
        run: npm run benchmark:smoke
      - name: Packed-install smoke
        run: npm run package:smoke
      - name: Diff check
        run: git diff --check
      - name: Commit verified implementation
        run: |
          git config user.name "Nhơn Lê"
          git config user.email "lenhonbp@gmail.com"
          git add src/closing-intelligence.js src/activation.js src/cli-entry.js src/mcp-entry.js tests/closing-intelligence.test.js tests/closing-mcp.test.js docs/CLOSING_INTELLIGENCE.md CHANGELOG.md
          git commit -m "feat: add closing intelligence"
          git push origin HEAD:feat/v0.11-closing-intelligence
