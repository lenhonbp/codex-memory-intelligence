name: Closing intelligence development patch

on:
  push:
    branches:
      - feat/v0.11-closing-intelligence

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: ${{ startsWith(github.event.head_commit.message, 'chore: run closing intelligence patch') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/v0.11-closing-intelligence
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Apply closing-intelligence patch
        run: python3 .github/scripts/closing-intelligence-dev.py
      - name: Syntax-check changed source
        run: |
          node --check src/closing-intelligence.js
          node --check src/activation.js
          node --check src/cli-entry.js
          node --check src/mcp-entry.js
      - name: Verify repository
        run: npm run verify
      - name: Benchmark smoke
        run: npm run benchmark:smoke
      - name: Packed-install smoke
        run: npm run package:smoke
      - name: Diff check
        run: git diff --check
      - name: Commit verified implementation
        run: |
          git config user.name "Nhơn Lê"
          git config user.email "lenhonbp@gmail.com"
          git add src/closing-intelligence.js src/activation.js src/cli-entry.js src/mcp-entry.js tests/closing-intelligence.test.js tests/closing-mcp.test.js docs/CLOSING_INTELLIGENCE.md CHANGELOG.md
          git commit -m "feat: add closing intelligence"
          git push origin HEAD:feat/v0.11-closing-intelligence
