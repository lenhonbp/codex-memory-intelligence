name: CMI v0.8.0 release preparation

on:
  push:
    branches:
      - staging/v08-release-prep

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Prepare v0.8.0 metadata and docs
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          function replaceExact(file, from, to) {
            const text = fs.readFileSync(file, 'utf8');
            if (!text.includes(from)) throw new Error(`${file}: expected release-prep text was not found`);
            const next = text.replace(from, to);
            if (next === text) throw new Error(`${file}: replacement produced no change`);
            fs.writeFileSync(file, next);
          }

          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          if (pkg.version !== '0.7.0') throw new Error(`package.json version drifted: ${pkg.version}`);
          pkg.version = '0.8.0';
          pkg.description = 'Local-first project memory, dependency and impact intelligence, evidence-driven change history, and session continuation for AI coding agents.';
          fs.writeFileSync('package.json', `${JSON.stringify(pkg, null, 2)}\n`);

          replaceExact('src/version.js', "export const VERSION = '0.7.0';", "export const VERSION = '0.8.0';");

          replaceExact(
            'CHANGELOG.md',
            '## [Unreleased]\n\nThis section describes development-branch work only. The published package remains `0.7.0` until an intentional release changes version metadata and produces release artifacts.\n\n### Added',
            '## [Unreleased]\n\nNo unreleased changes yet.\n\n## [0.8.0] - 2026-08-07\n\n### Added'
          );
          replaceExact(
            'CHANGELOG.md',
            '- Session close is designed to surface problems and evidence-based follow-up immediately instead of requiring the user to ask what should happen next.\n\n### Evidence limits',
            '- Session close is designed to surface problems and evidence-based follow-up immediately instead of requiring the user to ask what should happen next.\n\n### Fixed\n\n- Top-level CLI help now exposes the Session and Finding command groups, and `change`, `session`, and `finding` group help exits cleanly.\n- `cmi mcp-config` now points to the session-aware `mcp-entry.js`, keeping generated configuration aligned with the installed `cmi-mcp` surface.\n\n### Evidence limits'
          );

          replaceExact(
            'README.md',
            '`v0.7.0` is the current published release line for the **Change Intelligence Loop**. It combines incremental project intelligence and evidence-labeled pre-change briefs with durable BEFORE → DURING → AFTER records that compare predicted scope with observed changed paths and derive bounded historical co-change and verification evidence. The npm badge above is the authoritative indicator of the version currently published to the registry.\n\nThe development branch for the next release is hardening trust and adding **Session Continuation Intelligence**: stale-aware retrieval, graph freshness checks, reviewed memory lifecycle, runtime-validated change records, local writer serialization, verification provenance, sample-sensitive behavioral calibration, persistent cross-session findings, prioritized next actions, and durable handoffs. These changes remain **unreleased** until the package version and release artifacts are intentionally advanced.',
            '`v0.8.0` is the current source release line for **Behavioral Change Intelligence, trust hardening, and Session Continuation Intelligence**. It builds on the Change Intelligence Loop with stale-aware retrieval, graph freshness checks, reviewed memory lifecycle, runtime-validated change records, local writer serialization, verification provenance, sample-sensitive behavioral calibration, persistent cross-session findings, prioritized next actions, and durable handoffs. The npm badge above is the authoritative indicator of the version currently published to the registry.\n\nSource metadata can briefly lead registry publication during a reviewed release preparation; install availability should always be checked against the npm badge rather than inferred from the repository version alone.'
          );
          replaceExact('README.md', 'On the unreleased v0.8 development line, durable memory separates **lifecycle** from **freshness**.', 'In v0.8.0, durable memory separates **lifecycle** from **freshness**.');
          replaceExact('README.md', 'The unreleased v0.8 line distinguishes ordinary `reported` verification from supplied `observed-command` metadata.', 'v0.8.0 distinguishes ordinary `reported` verification from supplied `observed-command` metadata.');
          replaceExact('README.md', 'The unreleased v0.8 development line adds a layer above individual code changes so CMI can answer:', 'v0.8.0 adds a layer above individual code changes so CMI can answer:');
          if (/unreleased v0\.8/i.test(fs.readFileSync('README.md', 'utf8'))) throw new Error('README still contains unreleased v0.8 wording');

          replaceExact('docs/RELEASING.md', 'npm run release:check -- v0.5.0', 'npm run release:check -- v0.8.0');
          replaceExact('docs/RELEASING.md', 'Create a signed semantic tag such as `v0.5.0` on the reviewed `main` commit.', 'Create a signed semantic tag such as `v0.8.0` on the reviewed `main` commit.');
          NODE

      - name: Verify release candidate
        shell: bash
        run: |
          set -euo pipefail
          npm run verify
          npm run benchmark:smoke
          npm run package:smoke
          npm run release:check -- v0.8.0

      - name: Audit packed package contents
        shell: bash
        run: |
          set -euo pipefail
          npm pack --dry-run --json --ignore-scripts > /tmp/cmi-pack.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const pack = JSON.parse(fs.readFileSync('/tmp/cmi-pack.json', 'utf8'))[0];
          const names = new Set(pack.files.map((file) => file.path));
          for (const required of [
            'package.json',
            'src/cli-entry.js',
            'src/mcp-entry.js',
            'schemas/change-record.schema.json',
            'schemas/session-record.schema.json',
            'docs/CHANGE_INTELLIGENCE.md',
            'docs/SESSION_INTELLIGENCE.md',
            'README.md',
            'CHANGELOG.md',
            'LICENSE',
            'SECURITY.md'
          ]) {
            if (!names.has(required)) throw new Error(`packed package is missing ${required}`);
          }
          for (const forbidden of ['.github/workflows/publish.yml', 'tests/cmi.test.js', 'scripts/package-smoke.js', '.codex-memory/memory.md']) {
            if (names.has(forbidden)) throw new Error(`packed package unexpectedly includes ${forbidden}`);
          }
          console.log(`Pack audit passed: ${pack.files.length} files, ${pack.size} bytes tarball, ${pack.unpackedSize} bytes unpacked.`);
          NODE

      - name: Commit prepared release tree
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/v08-release-prep.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json src/version.js CHANGELOG.md README.md docs/RELEASING.md .github/workflows/v08-release-prep.yml
          git diff --cached --check
          git commit -m "chore: prepare v0.8.0 release"
          git push origin HEAD:${{ github.ref_name }}
