name: Apply v0.11 ambient patch retry

on:
  push:
    branches:
      - feat/v0.11-ambient-agent-intelligence
    paths:
      - .github/workflows/v011-ambient-apply2.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --package-lock=false
      - name: Materialize patch from staging workflow
        shell: bash
        run: |
          python - <<'PY'
          import base64, gzip, re, pathlib
          text = pathlib.Path('.github/workflows/v011-ambient-apply.yml').read_text()
          match = re.search(r"payload = '''([^']+)'''", text)
          if not match:
              raise SystemExit('staged patch payload not found')
          pathlib.Path('/tmp/apply-v011-ambient-patch.mjs').write_bytes(gzip.decompress(base64.b64decode(match.group(1))))
          PY
          node --check /tmp/apply-v011-ambient-patch.mjs
      - name: Apply patch
        run: node /tmp/apply-v011-ambient-patch.mjs
      - name: Verify
        run: |
          npm run verify
          npm run benchmark:smoke
          npm run package:smoke
          git diff --check
      - name: Commit implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests docs README.md CHANGELOG.md
          git diff --cached --check
          git commit -m "feat: add ambient agent intelligence"
          git push origin HEAD:feat/v0.11-ambient-agent-intelligence
