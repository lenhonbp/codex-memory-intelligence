name: Finalize v0.8.1 hardening literal boundary

on:
  push:
    branches:
      - "v0.8.1/trust-security-hardening"

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor == 'lenhonbp'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: "24.9.0"
          package-manager-cache: false
      - name: Apply and verify final hardening tree
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 -d > /tmp/v081-finalize.py
          python3 /tmp/v081-finalize.py
          npm run verify
          npm run benchmark:smoke
          npm run package:smoke
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: harden v0.8.1 evidence and storage trust"
          git push origin HEAD:"v0.8.1/trust-security-hardening"
