name: Patch v0.9.x field harness
on:
  push:
    paths:
      - '.github/workflows/v09x-fix-field-harness-v2.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: validation/v09x-stress-task-diversity-20260808
      - name: Patch harness
        run: |
          echo ' ' | tr -d ' ' | base64 --decode > /tmp/patch.py
          python3 /tmp/patch.py
      - name: Commit and push harness correction
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/v09x-real-stress-task-diversity.yml
          git commit -m 'ci: assert structured blocked impact results'
          git push origin HEAD:validation/v09x-stress-task-diversity-20260808
