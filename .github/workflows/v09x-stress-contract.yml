name: Implement v0.9.x Controlled-Stress Evaluation

on:
  push:
    paths:
      - '.github/workflows/v09x-stress-contract.yml'

permissions:
  contents: write

jobs:
  implement:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: v0.9x/real-repo-evaluation
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Apply controlled-stress contract
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import json

          def replace(path, old, new):
              p=Path(path); text=p.read_text()
              if old not in text:
                  raise SystemExit(f'anchor not found in {path}: {old[:80]!r}')
              p.write_text(text.replace(old,new,1))

          # Runtime contract
          p=Path('src/evaluation-contracts.js'); t=p.read_text()
          t=t.replace("export const EVALUATION_TASK_KINDS = ['implementation', 'debugging', 'audit', 'review', 'research', 'verification', 'no-code-investigation', 'unknown'];", "export const EVALUATION_TASK_KINDS = ['implementation', 'debugging', 'audit', 'review', 'research', 'verification', 'refactor', 'migration', 'architecture-analysis', 'no-code-investigation', 'unknown'];")
          t=t.replace("export const EVALUATION_UTILITY_RATINGS = ['useful', 'not-useful', 'unknown'];", "export const EVALUATION_UTILITY_RATINGS = ['useful', 'not-useful', 'unknown'];\nexport const EVALUATION_STRESS_SCENARIOS = ['rename-after-scan', 'history-rewrite', 'dirty-worktree', 'clock-skew', 'interrupted-session', 'concurrent-sessions', 'large-monorepo', 'corrupt-durable-record', 'stale-graph'];\nexport const EVALUATION_STRESS_OUTCOMES = ['not-applicable', 'pass', 'partial', 'fail'];")
          t=t.replace("['schemaVersion', 'id', 'recordedAt', 'subject', 'source', 'protocol', 'repository', 'task', 'measurements', 'review', 'policy']", "['schemaVersion', 'id', 'recordedAt', 'subject', 'source', 'protocol', 'repository', 'task', 'measurements', 'stress', 'review', 'policy']")
          anchor="""  const review = record.review;\n"""
          stress_block="""  const stress = record.stress;\n  fail(hasOnlyKeys(stress, new Set(['scenario', 'expectedInvariantCount', 'passedInvariantCount', 'failedInvariantCount', 'outcome'])), 'stress shape is invalid');\n  if (isObject(stress)) {\n    fail(stress.scenario === null || validEnum(stress.scenario, EVALUATION_STRESS_SCENARIOS), 'stress scenario is invalid');\n    for (const key of ['expectedInvariantCount', 'passedInvariantCount', 'failedInvariantCount']) fail(Number.isInteger(stress[key]) && stress[key] >= 0, `stress ${key} must be non-negative integer`);\n    fail(validEnum(stress.outcome, EVALUATION_STRESS_OUTCOMES), 'stress outcome is invalid');\n    if (Number.isInteger(stress.expectedInvariantCount) && Number.isInteger(stress.passedInvariantCount) && Number.isInteger(stress.failedInvariantCount)) {\n      fail(stress.passedInvariantCount + stress.failedInvariantCount === stress.expectedInvariantCount, 'stress invariant counts must sum to expectedInvariantCount');\n    }\n    if (protocol?.kind === 'observational') {\n      fail(stress.scenario === null && stress.expectedInvariantCount === 0 && stress.passedInvariantCount === 0 && stress.failedInvariantCount === 0 && stress.outcome === 'not-applicable', 'observational protocol cannot assert controlled-stress results');\n    }\n    if (protocol?.kind === 'controlled-stress') {\n      fail(validEnum(stress.scenario, EVALUATION_STRESS_SCENARIOS), 'controlled-stress protocol requires an explicit stress scenario');\n      fail(stress.expectedInvariantCount > 0, 'controlled-stress protocol requires at least one invariant');\n      const expectedOutcome = stress.failedInvariantCount === 0 ? 'pass' : stress.passedInvariantCount === 0 ? 'fail' : 'partial';\n      fail(stress.outcome === expectedOutcome, 'stress outcome must be derived from invariant counts');\n    }\n  }\n\n  const review = record.review;\n"""
          if anchor not in t: raise SystemExit('review anchor missing')
          t=t.replace(anchor, stress_block,1); p.write_text(t)

          # Evaluation engine
          p=Path('src/evaluation.js'); t=p.read_text()
          t=t.replace("  EVALUATION_UTILITY_RATINGS,\n", "  EVALUATION_UTILITY_RATINGS,\n  EVALUATION_STRESS_SCENARIOS,\n")
          anchor="""function sessionMetrics(session, handoff, openFindingCount) {\n"""
          helper="""function normalizeStress(options, protocolKind) {\n  const supplied = [options.stressScenario, options.stressExpected, options.stressPassed, options.stressFailed].some((value) => value !== undefined && value !== null && value !== '');\n  if (protocolKind === 'observational') {\n    if (supplied) throw new Error('Observational evaluation cannot assert controlled-stress scenario or invariant results.');\n    return { scenario: null, expectedInvariantCount: 0, passedInvariantCount: 0, failedInvariantCount: 0, outcome: 'not-applicable' };\n  }\n  const scenario = normalizeEnum(options.stressScenario, EVALUATION_STRESS_SCENARIOS, 'Stress scenario');\n  const expectedInvariantCount = normalizeOptionalCount(options.stressExpected, 'Stress expected invariant count');\n  const passedInvariantCount = normalizeOptionalCount(options.stressPassed, 'Stress passed invariant count');\n  const failedInvariantCount = normalizeOptionalCount(options.stressFailed, 'Stress failed invariant count');\n  if (!Number.isInteger(expectedInvariantCount) || expectedInvariantCount < 1) throw new Error('Controlled-stress evaluation requires --stress-expected >= 1.');\n  if (!Number.isInteger(passedInvariantCount) || !Number.isInteger(failedInvariantCount)) throw new Error('Controlled-stress evaluation requires explicit --stress-passed and --stress-failed counts.');\n  if (passedInvariantCount + failedInvariantCount !== expectedInvariantCount) throw new Error('Stress passed + failed invariant counts must equal expected invariant count.');\n  const outcome = failedInvariantCount === 0 ? 'pass' : passedInvariantCount === 0 ? 'fail' : 'partial';\n  return { scenario, expectedInvariantCount, passedInvariantCount, failedInvariantCount, outcome };\n}\n\nfunction sessionMetrics(session, handoff, openFindingCount) {\n"""
          if anchor not in t: raise SystemExit('sessionMetrics anchor missing')
          t=t.replace(anchor, helper,1)
          t=t.replace("  const review = normalizeReview(options);\n", "  const review = normalizeReview(options);\n  const stress = normalizeStress(options, protocolKind);\n",1)
          t=t.replace("    measurements: {\n", "    measurements: {\n",1)
          marker="""    review,\n    policy:"""
          if marker not in t: raise SystemExit('record review marker missing')
          t=t.replace(marker, """    stress,\n    review,\n    policy:""",1)
          old="""      taskKind: record.task.kind, reviewOutcome: record.review.outcome, reviewProvenance: record.review.provenance,\n      evidenceState: record.measurements.project.evidenceState,\n"""
          new="""      taskKind: record.task.kind, stressScenario: record.stress.scenario, stressOutcome: record.stress.outcome, reviewOutcome: record.review.outcome, reviewProvenance: record.review.provenance,\n      evidenceState: record.measurements.project.evidenceState,\n"""
          if old not in t: raise SystemExit('list summary anchor missing')
          t=t.replace(old,new,1)
          anchor="""function reviewedMetrics(records) {\n"""
          stress_helper="""function controlledStressMetrics(records) {\n  const expectedInvariantCount = records.reduce((sum, record) => sum + record.stress.expectedInvariantCount, 0);\n  const passedInvariantCount = records.reduce((sum, record) => sum + record.stress.passedInvariantCount, 0);\n  const failedInvariantCount = records.reduce((sum, record) => sum + record.stress.failedInvariantCount, 0);\n  return {\n    records: records.length,\n    uniqueRepositories: uniqueCount(records, (record) => record.repository.fingerprint),\n    scenarios: countBy(records, (record) => record.stress.scenario),\n    outcomes: countBy(records, (record) => record.stress.outcome),\n    passRate: rate(records.filter((record) => record.stress.outcome === 'pass').length, records.length),\n    expectedInvariantCount,\n    passedInvariantCount,\n    failedInvariantCount,\n    invariantPassRate: rate(passedInvariantCount, expectedInvariantCount),\n  };\n}\n\nfunction reviewedMetrics(records) {\n"""
          if anchor not in t: raise SystemExit('reviewedMetrics anchor missing')
          t=t.replace(anchor,stress_helper,1)
          t=t.replace("  const externalWithSession = observationalExternal.filter((record) => record.measurements.continuation.sessionPresent);\n", "  const externalWithSession = observationalExternal.filter((record) => record.measurements.continuation.sessionPresent);\n  const stressMetrics = controlledStressMetrics(controlledStressExternal);\n",1)
          t=t.replace("        taskKinds: countBy(external, (record) => record.task.kind),\n        protocols: countBy(external, (record) => record.protocol.kind),\n", "        taskKinds: countBy(external, (record) => record.task.kind),\n        observationalTaskKinds: countBy(observationalExternal, (record) => record.task.kind),\n        stressScenarios: countBy(controlledStressExternal, (record) => record.stress.scenario),\n        protocols: countBy(external, (record) => record.protocol.kind),\n",1)
          t=t.replace("    reviewedUsefulness: {\n", "    controlledStress: stressMetrics,\n    reviewedUsefulness: {\n",1)
          t=t.replace("      'Coverage state is based on observational external-real runs; controlled-stress runs are reported separately and cannot inflate ordinary field-coverage state.',", "      'Coverage state is based on observational external-real runs; controlled-stress runs are reported separately with invariant pass/fail counts and cannot inflate ordinary field-coverage state.',",1)
          old="""  return `# CMI evaluation ${record.id.slice(0, 12)}\\n\\n- CMI: ${record.subject.version}${record.subject.sourceRevision ? ` · ${record.subject.sourceRevision.slice(0, 12)}` : ''}\\n- Source: ${record.source.kind}${record.source.independent ? ' · independent repository evidence' : ''}\\n- Protocol: ${record.protocol.kind}\\n- Repository class: ${record.repository.class}\\n- Task kind: ${record.task.kind}\\n- Evidence health: ${record.measurements.project.evidenceState}\\n- Session outcome: ${record.measurements.continuation.outcome || 'none'}\\n- Open findings: ${record.measurements.continuation.openFindingCount}\\n- Next action: ${record.measurements.continuation.nextActionPresent ? record.measurements.continuation.nextActionPriority : 'none'}\\n- Review: ${record.review.outcome} · ${record.review.provenance}\\n\\n${record.policy}`;\n"""
          new="""  return `# CMI evaluation ${record.id.slice(0, 12)}\\n\\n- CMI: ${record.subject.version}${record.subject.sourceRevision ? ` · ${record.subject.sourceRevision.slice(0, 12)}` : ''}\\n- Source: ${record.source.kind}${record.source.independent ? ' · independent repository evidence' : ''}\\n- Protocol: ${record.protocol.kind}\\n- Stress: ${record.stress.scenario || 'n/a'} · ${record.stress.outcome} (${record.stress.passedInvariantCount}/${record.stress.expectedInvariantCount} invariants passed)\\n- Repository class: ${record.repository.class}\\n- Task kind: ${record.task.kind}\\n- Evidence health: ${record.measurements.project.evidenceState}\\n- Session outcome: ${record.measurements.continuation.outcome || 'none'}\\n- Open findings: ${record.measurements.continuation.openFindingCount}\\n- Next action: ${record.measurements.continuation.nextActionPresent ? record.measurements.continuation.nextActionPriority : 'none'}\\n- Review: ${record.review.outcome} · ${record.review.provenance}\\n\\n${record.policy}`;\n"""
          if old not in t: raise SystemExit('format record anchor missing')
          t=t.replace(old,new,1)
          old="""Records: ${report.corpus.totalRecords} · external-real ${external.records} · observational ${external.observationalRecords} · controlled-stress ${external.controlledStressRecords}\\nIndependent repositories: ${external.uniqueRepositories} · observational repositories ${external.observationalUniqueRepositories}\\nRepository classes: ${Object.keys(external.repositoryClasses).length} · task kinds: ${Object.keys(external.taskKinds).length}\\nReviewed observational external records:"""
          new="""Records: ${report.corpus.totalRecords} · external-real ${external.records} · observational ${external.observationalRecords} · controlled-stress ${external.controlledStressRecords}\\nIndependent repositories: ${external.uniqueRepositories} · observational repositories ${external.observationalUniqueRepositories}\\nRepository classes: ${Object.keys(external.repositoryClasses).length} · observational task kinds: ${Object.keys(external.observationalTaskKinds).length}\\nControlled stress: ${report.controlledStress.records} records · ${Object.keys(report.controlledStress.scenarios).length} scenarios · record pass rate ${report.controlledStress.passRate ?? 'n/a'} · invariant pass rate ${report.controlledStress.invariantPassRate ?? 'n/a'}\\nReviewed observational external records:"""
          if old not in t: raise SystemExit('format report anchor missing')
          t=t.replace(old,new,1)
          p.write_text(t)

          # JSON Schema
          p=Path('schemas/evaluation-record.schema.json'); data=json.loads(p.read_text())
          req=data['required']
          if 'stress' not in req: req.insert(req.index('review'),'stress')
          data['properties']['task']['properties']['kind']['enum']=['implementation','debugging','audit','review','research','verification','refactor','migration','architecture-analysis','no-code-investigation','unknown']
          data['properties']['stress']={
            'type':'object',
            'required':['scenario','expectedInvariantCount','passedInvariantCount','failedInvariantCount','outcome'],
            'properties':{
              'scenario':{'type':['string','null'],'enum':['rename-after-scan','history-rewrite','dirty-worktree','clock-skew','interrupted-session','concurrent-sessions','large-monorepo','corrupt-durable-record','stale-graph',None]},
              'expectedInvariantCount':{'type':'integer','minimum':0},
              'passedInvariantCount':{'type':'integer','minimum':0},
              'failedInvariantCount':{'type':'integer','minimum':0},
              'outcome':{'enum':['not-applicable','pass','partial','fail']}
            },
            'additionalProperties':False
          }
          p.write_text(json.dumps(data,indent=2)+"\n")

          # Quality schema parity
          p=Path('scripts/quality.js'); t=p.read_text()
          t=t.replace("EVALUATION_REVIEW_PROVENANCE, EVALUATION_UTILITY_RATINGS }", "EVALUATION_REVIEW_PROVENANCE, EVALUATION_UTILITY_RATINGS, EVALUATION_STRESS_SCENARIOS, EVALUATION_STRESS_OUTCOMES }")
          anchor="""  if (!sameValues(evaluation.properties?.review?.properties?.handoffRating?.enum, EVALUATION_UTILITY_RATINGS)) errors.push('evaluation handoff ratings differ from runtime contract');\n"""
          extra=anchor+"""  if (!sameValues((evaluation.properties?.stress?.properties?.scenario?.enum || []).filter((value) => value !== null), EVALUATION_STRESS_SCENARIOS)) errors.push('evaluation stress scenarios differ from runtime contract');\n  if (!sameValues(evaluation.properties?.stress?.properties?.outcome?.enum, EVALUATION_STRESS_OUTCOMES)) errors.push('evaluation stress outcomes differ from runtime contract');\n"""
          if anchor not in t: raise SystemExit('quality anchor missing')
          p.write_text(t.replace(anchor,extra,1))

          # CLI flags
          p=Path('src/cli-entry.js'); t=p.read_text()
          anchor="""    handoffRating: optionValues('--handoff-rating')[0],\n"""
          repl=anchor+"""    stressScenario: optionValues('--stress-scenario')[0],\n    stressExpected: optionValues('--stress-expected')[0],\n    stressPassed: optionValues('--stress-passed')[0],\n    stressFailed: optionValues('--stress-failed')[0],\n"""
          if anchor not in t: raise SystemExit('CLI eval options anchor missing')
          t=t.replace(anchor,repl,1)
          old="""['--source-kind','--protocol','--repository-class','--task-kind','--session','--review-outcome','--review-provenance','--false-positive-findings','--missed-findings','--next-action-rating','--handoff-rating','--limit']"""
          new="""['--source-kind','--protocol','--repository-class','--task-kind','--session','--review-outcome','--review-provenance','--false-positive-findings','--missed-findings','--next-action-rating','--handoff-rating','--stress-scenario','--stress-expected','--stress-passed','--stress-failed','--limit']"""
          if old not in t: raise SystemExit('CLI positional anchor missing')
          t=t.replace(old,new,1)
          t=t.replace("[--protocol observational|controlled-stress] [--repository-class class] [--task-kind kind] [--session latest|none|id]", "[--protocol observational|controlled-stress] [--repository-class class] [--task-kind kind] [--session latest|none|id] [--stress-scenario scenario --stress-expected N --stress-passed N --stress-failed N]")
          p.write_text(t)

          # MCP capture schema
          p=Path('src/mcp-entry.js'); t=p.read_text()
          t=t.replace("['implementation', 'debugging', 'audit', 'review', 'research', 'verification', 'no-code-investigation', 'unknown']", "['implementation', 'debugging', 'audit', 'review', 'research', 'verification', 'refactor', 'migration', 'architecture-analysis', 'no-code-investigation', 'unknown']",1)
          anchor="""    handoffRating: { type: 'string', enum: ['useful', 'not-useful', 'unknown'] },\n"""
          repl=anchor+"""    stressScenario: { type: 'string', enum: ['rename-after-scan', 'history-rewrite', 'dirty-worktree', 'clock-skew', 'interrupted-session', 'concurrent-sessions', 'large-monorepo', 'corrupt-durable-record', 'stale-graph'] },\n    stressExpected: { type: 'integer', minimum: 1 },\n    stressPassed: { type: 'integer', minimum: 0 },\n    stressFailed: { type: 'integer', minimum: 0 },\n"""
          if anchor not in t: raise SystemExit('MCP schema anchor missing')
          p.write_text(t.replace(anchor,repl,1))

          # Existing tests adapt to stronger contract
          p=Path('tests/evaluation.test.js'); t=p.read_text()
          old="""  await captureEvaluation(root, { sourceKind: 'external-real', protocolKind: 'controlled-stress', repositoryClass: 'library', taskKind: 'verification', session: 'none' });\n"""
          new="""  await captureEvaluation(root, { sourceKind: 'external-real', protocolKind: 'controlled-stress', repositoryClass: 'library', taskKind: 'verification', session: 'none', stressScenario: 'stale-graph', stressExpected: 2, stressPassed: 2, stressFailed: 0 });\n"""
          if old not in t: raise SystemExit('controlled stress test anchor missing')
          t=t.replace(old,new,1)
          t=t.replace("  assert.equal(report.coverage.state, 'none');\n", "  assert.equal(report.coverage.state, 'none');\n  assert.equal(report.controlledStress.records, 1);\n  assert.equal(report.controlledStress.passRate, 1);\n  assert.equal(report.controlledStress.invariantPassRate, 1);\n  assert.equal(report.controlledStress.scenarios['stale-graph'], 1);\n",1)
          p.write_text(t)

          # New stress regression tests
          Path('tests/evaluation-stress.test.js').write_text(r'''import test from 'node:test';
import assert from 'node:assert/strict';
import fs from 'node:fs/promises';
import os from 'node:os';
import path from 'node:path';
import { scanProject } from '../src/core.js';
import { captureEvaluation, buildEvaluationReport, validateEvaluationRecord } from '../src/evaluation.js';

async function fixture() {
  const root = await fs.mkdtemp(path.join(os.tmpdir(), 'cmi-eval-stress-'));
  await fs.writeFile(path.join(root, 'package.json'), '{"type":"module"}');
  await fs.mkdir(path.join(root, 'src'));
  await fs.writeFile(path.join(root, 'src', 'index.js'), 'export const x = 1;\n');
  await scanProject(root);
  return root;
}

test('observational evaluations reject controlled-stress assertions', async () => {
  const root = await fixture();
  await assert.rejects(() => captureEvaluation(root, {
    sourceKind: 'external-real', protocolKind: 'observational', repositoryClass: 'library', taskKind: 'audit', session: 'none',
    stressScenario: 'stale-graph', stressExpected: 1, stressPassed: 1, stressFailed: 0,
  }), /observational evaluation cannot assert controlled-stress/i);
});

test('controlled-stress requires explicit scenario and complete invariant counts', async () => {
  const root = await fixture();
  await assert.rejects(() => captureEvaluation(root, {
    sourceKind: 'external-real', protocolKind: 'controlled-stress', repositoryClass: 'library', taskKind: 'verification', session: 'none',
  }), /stress scenario/i);
  await assert.rejects(() => captureEvaluation(root, {
    sourceKind: 'external-real', protocolKind: 'controlled-stress', repositoryClass: 'library', taskKind: 'verification', session: 'none',
    stressScenario: 'history-rewrite', stressExpected: 3, stressPassed: 2, stressFailed: 0,
  }), /must equal expected/i);
});

test('stress outcome is derived from invariant counts and aggregate stays outside observational coverage', async () => {
  const root = await fixture();
  const partial = await captureEvaluation(root, {
    sourceKind: 'external-real', protocolKind: 'controlled-stress', repositoryClass: 'library', taskKind: 'verification', session: 'none',
    stressScenario: 'history-rewrite', stressExpected: 3, stressPassed: 2, stressFailed: 1,
  });
  assert.equal(partial.stress.outcome, 'partial');
  assert.equal(validateEvaluationRecord(partial), true);
  const failed = await captureEvaluation(root, {
    sourceKind: 'external-real', protocolKind: 'controlled-stress', repositoryClass: 'library', taskKind: 'verification', session: 'none',
    stressScenario: 'dirty-worktree', stressExpected: 2, stressPassed: 0, stressFailed: 2,
  });
  assert.equal(failed.stress.outcome, 'fail');
  const report = await buildEvaluationReport(root);
  assert.equal(report.coverage.state, 'none');
  assert.equal(report.corpus.externalReal.observationalRecords, 0);
  assert.equal(report.controlledStress.records, 2);
  assert.equal(report.controlledStress.outcomes.partial, 1);
  assert.equal(report.controlledStress.outcomes.fail, 1);
  assert.equal(report.controlledStress.expectedInvariantCount, 5);
  assert.equal(report.controlledStress.passedInvariantCount, 2);
  assert.equal(report.controlledStress.failedInvariantCount, 3);
});

test('expanded task taxonomy accepts refactor, migration, and architecture analysis without changing review provenance', async () => {
  for (const taskKind of ['refactor', 'migration', 'architecture-analysis']) {
    const root = await fixture();
    const record = await captureEvaluation(root, { sourceKind: 'synthetic', repositoryClass: 'tooling', taskKind, session: 'none' });
    assert.equal(record.task.kind, taskKind);
    assert.equal(record.review.provenance, 'unreviewed');
    assert.equal(record.stress.outcome, 'not-applicable');
  }
});
''')

          # Docs
          p=Path('docs/EVALUATION.md'); t=p.read_text()
          insert='''\n## Controlled real-repository stress\n\nA `controlled-stress` record must identify one bounded scenario and invariant counts. The record does not retain arbitrary scenario prose. Supported scenarios are `rename-after-scan`, `history-rewrite`, `dirty-worktree`, `clock-skew`, `interrupted-session`, `concurrent-sessions`, `large-monorepo`, `corrupt-durable-record`, and `stale-graph`.\n\nCapture example:\n\n```bash\ncmi evaluate capture \\\n  --source-kind external-real \\\n  --protocol controlled-stress \\\n  --repository-class library \\\n  --task-kind verification \\\n  --session none \\\n  --stress-scenario stale-graph \\\n  --stress-expected 3 \\\n  --stress-passed 3 \\\n  --stress-failed 0\n```\n\n`pass`, `partial`, or `fail` is derived from the invariant counts; callers cannot supply a more favorable stress outcome. Observational records reject stress fields. Reports aggregate stress scenario coverage and invariant pass rate separately from ordinary field coverage.\n'''
          marker='\n## Runtime contract\n'
          if marker not in t: raise SystemExit('evaluation doc marker missing')
          p.write_text(t.replace(marker,insert+marker,1))

          p=Path('ROADMAP.md'); t=p.read_text()
          old='''- [ ] Add controlled real-repository stress runs for rename-after-scan, rebases, dirty worktrees, clock skew, and large monorepos.\n'''
          new='''- [x] Add a controlled-stress evaluation contract with explicit scenario taxonomy, derived pass/partial/fail outcome, and invariant-count aggregation that cannot inflate observational coverage.\n- [ ] Complete controlled external-real stress evidence for rename-after-scan, rebases/history rewrite, dirty worktrees, clock skew, and large monorepos.\n'''
          if old not in t: raise SystemExit('roadmap stress anchor missing')
          p.write_text(t.replace(old,new,1))

          p=Path('CHANGELOG.md'); t=p.read_text()
          marker='## [Unreleased]\n'
          if marker not in t: raise SystemExit('changelog unreleased missing')
          bullet='''\n- Added controlled real-repository stress evaluation with explicit scenario taxonomy, derived invariant outcomes, separate aggregate stress metrics, and CLI/MCP parity without inflating observational coverage.\n'''
          if bullet.strip() not in t:
              t=t.replace(marker,marker+bullet,1)
          p.write_text(t)
          PY
      - name: Remove implementation helper
        run: rm .github/workflows/v09x-stress-contract.yml
      - name: Verify repository
        run: npm run verify
      - name: Benchmark incremental intelligence
        run: npm run benchmark:smoke
      - name: Test packed installation
        run: npm run package:smoke
      - name: Validate unreleased diff discipline
        shell: bash
        run: |
          test "$(node -p "require('./package.json').version")" = "0.9.0"
          test "$(node src/cli-entry.js --version)" = "0.9.0"
          test ! -e .github/workflows/v09x-stress-contract.yml
          git diff --check
      - name: Commit validated stress contract
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: add controlled-stress evaluation contract'
      - name: Push validated stress contract
        run: git push origin HEAD:v0.9x/real-repo-evaluation
