name: CMI v0.8 experiential audit v2

on:
  push:
    branches:
      - audit/v08-experiential-20260807

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false
      - name: Harden audit-only MCP teardown
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/experiential-audit.js')
          s = p.read_text()
          old = """  async function close() {\n    lines.close();\n    child.kill();\n    await new Promise((resolve) => child.once('close', resolve));\n  }"""
          new = """  async function close() {\n    lines.close();\n    if (child.exitCode !== null || child.signalCode !== null) return;\n    const closed = new Promise((resolve) => child.once('close', resolve));\n    child.kill();\n    await Promise.race([closed, new Promise((resolve) => setTimeout(resolve, 1500))]);\n    if (child.exitCode === null && child.signalCode === null) child.kill('SIGKILL');\n  }"""
          if old not in s:
              raise SystemExit('expected teardown block not found')
          p.write_text(s.replace(old, new))
          PY
      - name: Pack exact candidate package surface
        id: pack
        shell: bash
        run: |
          set -euo pipefail
          tarball="$(npm pack --ignore-scripts --silent)"
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"
      - name: Exercise installed package end to end with hard ceiling
        shell: bash
        run: |
          set -euo pipefail
          timeout 300s node scripts/experiential-audit.js "$PWD/${{ steps.pack.outputs.tarball }}"
