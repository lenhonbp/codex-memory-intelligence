name: Recover v0.9.x empirical hardening

on:
  push:
    paths:
      - '.github/workflows/v09x-empirical-recover.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: v0.9x/real-repo-evaluation
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Apply empirical hardening
        run: |
          python3 scripts/.v09x_empirical_finish.py
          python3 scripts/.v09x_generated_cache_recover.py
      - name: Remove temporary helpers
        run: rm -f scripts/.v09x_empirical_finish.py scripts/.v09x_generated_cache_recover.py .github/workflows/v09x-empirical-finish.yml .github/workflows/v09x-empirical-recover.yml
      - name: Verify repository
        run: npm run verify
      - name: Benchmark incremental intelligence
        run: npm run benchmark:smoke
      - name: Test packed installation
        run: npm run package:smoke
      - name: Validate unreleased discipline
        run: |
          test "$(node -p "require('./package.json').version")" = "0.9.0"
          test "$(node src/cli-entry.js --version)" = "0.9.0"
          git diff --check
      - name: Commit validated product tree
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: harden large-repo evaluation and post-hoc review'
      - name: Push validated product tree
        run: git push origin HEAD:v0.9x/real-repo-evaluation
