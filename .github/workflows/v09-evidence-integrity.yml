name: Implement v0.9 Evidence Integrity

on:
  push:
    branches:
      - v0.9/evidence-integrity

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24.9.0
          package-manager-cache: false
      - name: Apply evidence-integrity patch
        run: python3 scripts/_v09_evidence_integrity_patch.py
      - name: Remove implementation helpers
        run: rm -f scripts/_v09_evidence_integrity_patch.py .github/workflows/v09-evidence-integrity.yml
      - name: Verify repository
        run: npm run verify
      - name: Benchmark incremental intelligence
        run: npm run benchmark:smoke
      - name: Test packed installation
        run: npm run package:smoke
      - name: Validate diff and unreleased version discipline
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test "$(node -p "require('./package.json').version")" = "0.8.1"
          test ! -e scripts/_v09_evidence_integrity_patch.py
          test ! -e .github/workflows/v09-evidence-integrity.yml
      - name: Commit implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add v0.9 evidence integrity"
          git push origin HEAD:v0.9/evidence-integrity
