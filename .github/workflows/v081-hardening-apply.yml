name: Apply v0.8.1 trust hardening

on:
  push:
    branches:
      - "v0.8.1/trust-security-hardening"

permissions:
  contents: write

jobs:
  apply:
    if: github.actor == 'lenhonbp'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: "24.9.0"
          package-manager-cache: false

      - name: Apply trust and security hardening
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          def read(p): return Path(p).read_text()
          def write(p, s): Path(p).write_text(s)
          def exact(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'missing patch anchor: {label}')
              return text.replace(old, new, 1)
          def regex(text, pattern, repl, label, flags=re.S):
              out, n = re.subn(pattern, repl, text, count=1, flags=flags)
              if n != 1:
                  raise SystemExit(f'expected one regex patch for {label}, got {n}')
              return out

          write('src/sensitive.js', r'''function shannonEntropy(value) {
            const text = String(value || '');
            if (!text) return 0;
            const counts = new Map();
            for (const char of text) counts.set(char, (counts.get(char) || 0) + 1);
            let entropy = 0;
            for (const count of counts.values()) {
              const probability = count / text.length;
              entropy -= probability * Math.log2(probability);
            }
            return entropy;
          }

          function credentialLike(value) {
            const token = String(value || '');
            if (token.length < 20 || token.length > 500 || /\s/.test(token)) return false;
            if (/^[0-9a-f]{40,64}$/i.test(token)) return false;
            if (/^[0-9a-f-]{32,36}$/i.test(token)) return false;
            const classes = [/[a-z]/.test(token), /[A-Z]/.test(token), /\d/.test(token), /[-_+/=.]/.test(token)].filter(Boolean).length;
            return classes >= 3 && shannonEntropy(token) >= 3.5;
          }

          export function looksSensitive(value) {
            const text = String(value || '');
            if (!text) return false;
            if (/-----BEGIN [A-Z ]*(?:PRIVATE KEY|OPENSSH PRIVATE KEY)-----/.test(text)) return true;
            if (/\b(?:api[_ -]?key|password|passwd|secret|client[_ -]?secret|access[_ -]?token|refresh[_ -]?token|auth(?:orization)?|credential)\s*[:=]\s*\S{6,}/i.test(text)) return true;
            if (/\bBearer\s+[A-Za-z0-9._~+\/-]{16,}={0,2}\b/i.test(text)) return true;
            if (/\b[A-Za-z][A-Za-z0-9+.-]*:\/\/[^\s/:@]+:[^\s/@]+@/i.test(text)) return true;
            if (/\beyJ[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]{8,}\b/.test(text)) return true;
            if (/\b(?:AKIA|ASIA)[A-Z0-9]{16}\b/.test(text)) return true;
            if (/\bAIza[0-9A-Za-z_-]{30,}\b/.test(text)) return true;
            if (/\b(?:ghp|gho|ghu|ghs|ghr|github_pat|glpat|npm_|xox[baprs]|sk_live|rk_live)[-_A-Za-z0-9]{12,}\b/.test(text)) return true;
            for (const match of text.matchAll(/\b(?:token|secret|key|credential)\b[^\n]{0,24}?([A-Za-z0-9_+\/.=-]{20,})/gi)) {
              if (credentialLike(match[1])) return true;
            }
            return false;
          }

          export const SECRET_GUARD_DESCRIPTION = 'Best-effort accidental-secret detection only; not a DLP or security boundary.';
          ''')

          write('src/lease-lock.js', r'''import fs from 'node:fs/promises';
          import { constants as fsConstants } from 'node:fs';
          import path from 'node:path';
          import crypto from 'node:crypto';

          const sleep = (milliseconds) => new Promise((resolve) => setTimeout(resolve, milliseconds));

          async function readLease(target) {
            let handle;
            try {
              const noFollow = typeof fsConstants.O_NOFOLLOW === 'number' ? fsConstants.O_NOFOLLOW : 0;
              handle = await fs.open(target, fsConstants.O_RDONLY | noFollow);
              const stat = await handle.stat();
              if (!stat.isFile() || stat.size > 16_384) return null;
              const value = JSON.parse(await handle.readFile('utf8'));
              return value && typeof value.ownerId === 'string' ? { ...value, mtimeMs: stat.mtimeMs } : null;
            } catch { return null; }
            finally { await handle?.close().catch(() => {}); }
          }

          async function removeIfOwned(target, ownerId) {
            const current = await readLease(target);
            if (!current || current.ownerId !== ownerId) return false;
            await fs.rm(target, { force: true }).catch(() => {});
            return true;
          }

          export async function acquireLeaseLock(target, options = {}) {
            const staleMs = Math.max(50, Number(options.staleMs) || 30_000);
            const retries = Math.max(0, Number(options.retries) || 80);
            const retryMs = Math.max(1, Number(options.retryMs) || 15);
            await fs.mkdir(path.dirname(target), { recursive: True } if False else { recursive: true });
            for (let attempt = 0; attempt <= retries; attempt += 1) {
              const ownerId = crypto.randomUUID();
              try {
                const handle = await fs.open(target, 'wx', 0o600);
                const createdAt = new Date().toISOString();
                await handle.writeFile(`${JSON.stringify({ ownerId, pid: process.pid, createdAt })}\n`, 'utf8');
                const heartbeatMs = Math.max(25, Math.floor(staleMs / 3));
                const heartbeat = setInterval(() => {
                  const now = new Date();
                  handle.utimes(now, now).catch(() => {});
                }, heartbeatMs);
                heartbeat.unref?.();
                return { target, ownerId, handle, heartbeat, staleMs };
              } catch (error) {
                if (error?.code !== 'EEXIST') throw error;
                const observed = await readLease(target);
                if (!observed) {
                  await sleep(retryMs);
                  continue;
                }
                if (Date.now() - observed.mtimeMs > staleMs) {
                  await sleep(2);
                  const confirmed = await readLease(target);
                  if (confirmed?.ownerId === observed.ownerId && Date.now() - confirmed.mtimeMs > staleMs) {
                    await removeIfOwned(target, observed.ownerId);
                    continue;
                  }
                }
                if (attempt >= retries) throw new Error(`Timed out waiting for lock: ${path.basename(target)}`);
                await sleep(retryMs + Math.min(100, attempt));
              }
            }
            throw new Error(`Unable to acquire lock: ${path.basename(target)}`);
          }

          export async function releaseLeaseLock(lock) {
            if (!lock) return;
            clearInterval(lock.heartbeat);
            await removeIfOwned(lock.target, lock.ownerId);
            await lock.handle?.close().catch(() => {});
          }

          export async function withLeaseLock(target, operation, options = {}) {
            const lock = await acquireLeaseLock(target, options);
            try { return await operation(lock); }
            finally { await releaseLeaseLock(lock); }
          }
          ''').replace("{ recursive: True } if False else { recursive: true }", "{ recursive: true }")

          write('src/storage.js', r'''import fs from 'node:fs/promises';
          import { constants as fsConstants } from 'node:fs';
          import path from 'node:path';
          import crypto from 'node:crypto';

          export const MEMORY_DIR = '.codex-memory';
          export const DEFAULT_MAX_DURABLE_BYTES = 1_000_000;

          function unsafe(reason) {
            const error = new Error(`Unsafe CMI storage: ${reason}`);
            error.code = 'CMI_UNSAFE_STORAGE';
            return error;
          }

          function normalizeRelative(value) {
            const raw = String(value || '').replace(/\\/g, '/').replace(/^\.\//, '');
            if (!raw || raw.startsWith('/') || /^[A-Za-z]:\//.test(raw)) throw unsafe(`invalid durable path: ${value}`);
            const parts = raw.split('/').filter(Boolean);
            if (!parts.length || parts.some((part) => part === '.' || part === '..')) throw unsafe(`durable path escapes storage root: ${value}`);
            return parts.join('/');
          }

          function inside(base, candidate) {
            const relative = path.relative(base, candidate);
            return Boolean(relative) && relative !== '..' && !relative.startsWith(`..${path.sep}`) && !path.isAbsolute(relative);
          }

          export async function ensureSafeMemoryRoot(root, options = {}) {
            const rootAbsolute = path.resolve(root);
            const memory = path.join(rootAbsolute, MEMORY_DIR);
            let stat = null;
            try { stat = await fs.lstat(memory); }
            catch (error) {
              if (error?.code !== 'ENOENT') throw error;
              if (!options.create) return null;
              try { await fs.mkdir(memory, { mode: 0o700 }); }
              catch (mkdirError) { if (mkdirError?.code !== 'EEXIST') throw mkdirError; }
              stat = await fs.lstat(memory);
            }
            if (stat.isSymbolicLink()) throw unsafe(`${MEMORY_DIR} must not be a symbolic link.`);
            if (!stat.isDirectory()) throw unsafe(`${MEMORY_DIR} must be a directory.`);
            const [realRoot, realMemory] = await Promise.all([fs.realpath(rootAbsolute), fs.realpath(memory)]);
            if (!inside(realRoot, realMemory)) throw unsafe(`${MEMORY_DIR} resolves outside the project.`);
            return memory;
          }

          export async function safeEnsureMemoryDir(root, relative) {
            const memory = await ensureSafeMemoryRoot(root, { create: true });
            let current = memory;
            for (const part of normalizeRelative(relative).split('/')) {
              current = path.join(current, part);
              try { await fs.mkdir(current, { mode: 0o700 }); }
              catch (error) { if (error?.code !== 'EEXIST') throw error; }
              const stat = await fs.lstat(current);
              if (stat.isSymbolicLink() || !stat.isDirectory()) throw unsafe(`durable directory is not a safe directory: ${relative}`);
              const realMemory = await fs.realpath(memory);
              const realCurrent = await fs.realpath(current);
              if (!inside(realMemory, realCurrent)) throw unsafe(`durable directory escapes storage root: ${relative}`);
            }
            return current;
          }

          async function resolveSafeFile(root, relative, options = {}) {
            const normalized = normalizeRelative(relative);
            const parent = path.posix.dirname(normalized);
            const memory = await ensureSafeMemoryRoot(root, { create: Boolean(options.createParent) });
            if (!memory) return null;
            if (parent && parent !== '.') {
              if (options.createParent) await safeEnsureMemoryDir(root, parent);
              else {
                let current = memory;
                for (const part of parent.split('/')) {
                  current = path.join(current, part);
                  const stat = await fs.lstat(current);
                  if (stat.isSymbolicLink() || !stat.isDirectory()) throw unsafe(`unsafe durable parent: ${parent}`);
                }
              }
            }
            const target = path.join(memory, ...normalized.split('/'));
            if (!inside(memory, target)) throw unsafe(`durable file escapes storage root: ${relative}`);
            return target;
          }

          async function openNoFollow(target, flags, mode) {
            const noFollow = typeof fsConstants.O_NOFOLLOW === 'number' ? fsConstants.O_NOFOLLOW : 0;
            try { return await fs.open(target, flags | noFollow, mode); }
            catch (error) {
              if (!noFollow || !['EINVAL', 'ENOTSUP'].includes(error?.code)) throw error;
              return fs.open(target, flags, mode);
            }
          }

          export async function safeReadMemoryFile(root, relative, options = {}) {
            const target = await resolveSafeFile(root, relative, { createParent: false }).catch((error) => {
              if (options.optional && error?.code === 'ENOENT') return null;
              throw error;
            });
            if (!target) return null;
            let handle;
            try {
              const before = await fs.lstat(target);
              if (before.isSymbolicLink() || !before.isFile()) throw unsafe(`durable file is not a regular file: ${relative}`);
              const maxBytes = Number(options.maxBytes) || DEFAULT_MAX_DURABLE_BYTES;
              if (before.size > maxBytes) throw unsafe(`durable file exceeds ${maxBytes} bytes: ${relative}`);
              handle = await openNoFollow(target, fsConstants.O_RDONLY);
              const opened = await handle.stat();
              if (!opened.isFile() || opened.size > maxBytes) throw unsafe(`durable file changed or is oversized: ${relative}`);
              if (before.dev !== opened.dev || before.ino !== opened.ino) throw unsafe(`durable file identity changed while opening: ${relative}`);
              return await handle.readFile(options.encoding || 'utf8');
            } catch (error) {
              if (options.optional && error?.code === 'ENOENT') return null;
              throw error;
            } finally { await handle?.close().catch(() => {}); }
          }

          export async function safeReadMemoryJson(root, relative, options = {}) {
            const text = await safeReadMemoryFile(root, relative, options);
            return text === null ? null : JSON.parse(text);
          }

          async function assertExistingTargetSafe(target, relative) {
            try {
              const stat = await fs.lstat(target);
              if (stat.isSymbolicLink() || !stat.isFile()) throw unsafe(`durable write target is not a regular file: ${relative}`);
              return true;
            } catch (error) {
              if (error?.code === 'ENOENT') return false;
              throw error;
            }
          }

          export async function safeWriteMemoryFile(root, relative, content, options = {}) {
            const target = await resolveSafeFile(root, relative, { createParent: true });
            const exists = await assertExistingTargetSafe(target, relative);
            if (options.ifMissing && exists) return false;
            if (options.ifMissing) {
              const handle = await openNoFollow(target, fsConstants.O_WRONLY | fsConstants.O_CREAT | fsConstants.O_EXCL, 0o600);
              try { await handle.writeFile(content, options.encoding || 'utf8'); }
              finally { await handle.close(); }
              return true;
            }
            const temporary = `${target}.${process.pid}.${crypto.randomBytes(6).toString('hex')}.tmp`;
            const tempHandle = await fs.open(temporary, 'wx', 0o600);
            try { await tempHandle.writeFile(content, options.encoding || 'utf8'); }
            finally { await tempHandle.close(); }
            try {
              await fs.rename(temporary, target);
            } catch (error) {
              if (!exists || !['EEXIST', 'EPERM'].includes(error?.code)) {
                await fs.rm(temporary, { force: true }).catch(() => {});
                throw error;
              }
              const backup = `${target}.${process.pid}.${crypto.randomBytes(6).toString('hex')}.bak`;
              let moved = false;
              try {
                await fs.rename(target, backup);
                moved = true;
                await fs.rename(temporary, target);
                await fs.rm(backup, { force: true });
              } catch (fallbackError) {
                await fs.rm(temporary, { force: true }).catch(() => {});
                if (moved) {
                  const targetExists = await fs.lstat(target).then(() => true).catch(() => false);
                  if (!targetExists) await fs.rename(backup, target).catch(() => {});
                }
                throw fallbackError;
              }
            }
            return true;
          }

          export async function safeAppendMemoryFile(root, relative, content) {
            const target = await resolveSafeFile(root, relative, { createParent: true });
            const exists = await assertExistingTargetSafe(target, relative);
            const flags = fsConstants.O_WRONLY | fsConstants.O_APPEND | (exists ? 0 : fsConstants.O_CREAT) | (exists ? 0 : fsConstants.O_EXCL);
            const handle = await openNoFollow(target, flags, 0o600);
            try {
              const stat = await handle.stat();
              if (!stat.isFile()) throw unsafe(`durable append target is not a regular file: ${relative}`);
              await handle.writeFile(content, 'utf8');
            } finally { await handle.close(); }
          }

          export async function safeListMemoryDir(root, relative) {
            const directory = await safeEnsureMemoryDir(root, relative);
            return fs.readdir(directory);
          }
          ''')

          # core.js
          p = 'src/core.js'; text = read(p)
          text = exact(text, "import { resolveProjectFile } from './paths.js';\n", "import { resolveProjectFile } from './paths.js';\nimport { ensureSafeMemoryRoot, safeEnsureMemoryDir, safeReadMemoryFile, safeReadMemoryJson, safeWriteMemoryFile, safeAppendMemoryFile, safeListMemoryDir } from './storage.js';\nimport { looksSensitive } from './sensitive.js';\n", 'core imports')
          text = regex(text, r"export async function initProject\(root\) \{.*?\n\}\n\nexport async function readConfig\(root\) \{.*?\n\}", r'''export async function initProject(root) {
            const directory = await ensureSafeMemoryRoot(root, { create: true });
            await safeEnsureMemoryDir(root, 'snapshots');
            await safeWriteMemoryFile(root, 'memory.md', '# Project Memory\n\nDurable facts, conventions, constraints, and operational knowledge.\n', { ifMissing: true });
            await safeWriteMemoryFile(root, 'decisions.md', '# Architecture Decisions\n\nRecord the context, decision, and consequences.\n', { ifMissing: true });
            await safeWriteMemoryFile(root, 'mistakes.md', '# Mistakes and Lessons\n\nRecord failures, root causes, fixes, and prevention rules.\n', { ifMissing: true });
            await safeWriteMemoryFile(root, 'architecture.md', '# Project Architecture\n\nRun `cmi scan` to refresh this file.\n', { ifMissing: true });
            await safeWriteMemoryFile(root, 'agent-instructions.md', '# Agent Instructions\n\n1. Search project memory before broad repository exploration.\n2. Check memory health before relying on old decisions.\n3. Read decisions before architectural changes.\n4. Run impact analysis before changing shared files or symbols.\n5. Read mistakes before risky operations or deployment.\n6. Store only durable knowledge, never secrets or temporary logs.\n7. Refresh project intelligence after structural changes.\n8. Use workspace-scoped search in monorepositories.\n9. Treat MCP durable-memory mutations as opt-in operations that require review.\n', { ifMissing: true });
            await safeWriteMemoryFile(root, '.gitignore', 'project-graph.json\nproject-index.json\nsnapshots/\n', { ifMissing: true });
            const currentConfig = await safeReadMemoryJson(root, 'config.json', { optional: true }) || {};
            const migratedConfig = normalizeConfig(currentConfig);
            if (JSON.stringify(currentConfig) !== JSON.stringify(migratedConfig)) {
              await safeWriteMemoryFile(root, 'config.json', JSON.stringify(migratedConfig, null, 2) + '\n');
            } else if (!(await safeReadMemoryFile(root, 'config.json', { optional: true }))) {
              await safeWriteMemoryFile(root, 'config.json', JSON.stringify(migratedConfig, null, 2) + '\n');
            }
            return directory;
          }

          export async function readConfig(root) {
            const current = await safeReadMemoryJson(root, 'config.json', { optional: true });
            return normalizeConfig(current || {});
          }''', 'init/readConfig')
          text = regex(text, r"\nfunction looksSensitive\(text\) \{.*?\n\}\n\nasync function normalizeSources", "\nasync function normalizeSources", 'core sensitive helper')
          text = exact(text, "  await fs.writeFile(path.join(root, MEMORY_DIR, 'architecture.md'), architectureMarkdown(manifest, graph, workspaceReport, directories, configFiles), 'utf8');\n  await fs.writeFile(path.join(root, MEMORY_DIR, 'project-index.json'), JSON.stringify(manifest, null, 2) + '\\n', 'utf8');\n  await fs.writeFile(path.join(root, MEMORY_DIR, 'project-graph.json'), JSON.stringify(graph, null, 2) + '\\n', 'utf8');", "  await safeWriteMemoryFile(root, 'architecture.md', architectureMarkdown(manifest, graph, workspaceReport, directories, configFiles));\n  await safeWriteMemoryFile(root, 'project-index.json', JSON.stringify(manifest, null, 2) + '\\n');\n  await safeWriteMemoryFile(root, 'project-graph.json', JSON.stringify(graph, null, 2) + '\\n');", 'scan writes')
          text = exact(text, "  let index = null;\n  try { index = JSON.parse(await fs.readFile(path.join(root, MEMORY_DIR, 'project-index.json'), 'utf8')); } catch {}", "  const index = await safeReadMemoryJson(root, 'project-index.json', { optional: true });", 'remember index')
          text = exact(text, "  await withMemoryWriteLock(root, () => fs.appendFile(path.join(root, MEMORY_DIR, fileName), `\\n## ${createdAt}\\n\\n<!-- cmi-meta:${JSON.stringify(metadata)} -->\\n\\n${clean}\\n`, 'utf8'));", "  await withMemoryWriteLock(root, () => safeAppendMemoryFile(root, fileName, `\\n## ${createdAt}\\n\\n<!-- cmi-meta:${JSON.stringify(metadata)} -->\\n\\n${clean}\\n`));", 'remember append')
          text = exact(text, "  await fs.writeFile(path.join(root, MEMORY_DIR, 'snapshots', fileName), JSON.stringify(data, null, 2) + '\\n', 'utf8');", "  await safeWriteMemoryFile(root, `snapshots/${fileName}`, JSON.stringify(data, null, 2) + '\\n');", 'snapshot write')
          text = regex(text, r"async function countEntries\(filePath\) \{.*?\n\}\n\nexport async function status\(root\) \{.*?\n\}\n\nexport async function doctor", r'''async function countEntries(root, relative) {
            try { return (await safeReadMemoryFile(root, relative)).split('\n').filter((line) => /^## \d{4}-/.test(line)).length; }
            catch { return 0; }
          }

          export async function status(root) {
            let directory = null;
            try { directory = await ensureSafeMemoryRoot(root, { create: false }); }
            catch (error) {
              return { initialized: true, healthy: false, storageHealth: { safe: false, reason: error.message }, index: null, graph: null, graphHealth: null, workspaces: null, entries: null, memoryHealth: null, snapshots: 0 };
            }
            if (!directory) return { initialized: false };
            const index = await safeReadMemoryJson(root, 'project-index.json', { optional: true }).catch(() => null);
            const graph = await safeReadMemoryJson(root, 'project-graph.json', { optional: true }).catch(() => null);
            const snapshots = await safeListMemoryDir(root, 'snapshots').catch(() => []);
            const entries = { facts: await countEntries(root, 'memory.md'), decisions: await countEntries(root, 'decisions.md'), mistakes: await countEntries(root, 'mistakes.md') };
            const memoryHealth = await checkStaleMemory(root);
            const loaded = await loadMemory(root, { withHealth: true });
            const graphHealth = loaded.graphHealth;
            return {
              initialized: true,
              healthy: Boolean(index && graph && graphHealth.healthy && memoryHealth.counts.stale === 0 && memoryHealth.counts.review === 0 && memoryHealth.counts.untracked === 0),
              storageHealth: { safe: true },
              index,
              graph: graph?.summary || null,
              graphHealth,
              workspaces: index?.workspaces || null,
              entries,
              memoryHealth: memoryHealth.counts,
              snapshots: snapshots.length,
            };
          }

          export async function doctor''', 'status block')
          text = exact(text, "  const initialized = await exists(path.join(root, MEMORY_DIR));\n  add('memory', initialized ? 'pass' : 'warn', initialized ? 'Project memory is initialized.' : 'Run cmi init to create project memory.');", "  let memoryRoot = null;\n  let storageError = null;\n  try { memoryRoot = await ensureSafeMemoryRoot(root, { create: false }); } catch (error) { storageError = error; }\n  const initialized = Boolean(memoryRoot);\n  add('storage-integrity', storageError ? 'fail' : initialized ? 'pass' : 'warn', storageError ? storageError.message : initialized ? '.codex-memory is a project-local non-symlink directory.' : 'Project memory is not initialized.');\n  add('memory', initialized ? 'pass' : 'warn', initialized ? 'Project memory is initialized.' : 'Run cmi init to create project memory.');", 'doctor storage')
          text = exact(text, "    add('graph-health', projectStatus.graphHealth?.current ? 'pass' : 'warn', projectStatus.graphHealth?.current ? 'Project graph fingerprints match current source files.' : `Project graph is stale or incomplete (${projectStatus.graphHealth?.staleNodes || 0} stale, ${projectStatus.graphHealth?.missingNodes || 0} missing). Run cmi scan.`);", "    add('graph-health', projectStatus.graphHealth?.healthy ? 'pass' : 'warn', projectStatus.graphHealth?.healthy ? 'Project graph is current and complete within configured coverage.' : `Project graph is degraded (${projectStatus.graphHealth?.staleNodes || 0} stale, ${projectStatus.graphHealth?.missingNodes || 0} missing, truncated=${Boolean(projectStatus.graphHealth?.truncated)}). Run cmi scan or raise graph limits.`);", 'doctor graph health')
          write(p, text)

          # graph.js
          p='src/graph.js'; text=read(p)
          text=exact(text, "import { workspaceForPath } from './workspaces.js';\n", "import { workspaceForPath } from './workspaces.js';\nimport { safeReadMemoryJson } from './storage.js';\n", 'graph storage import')
          text=regex(text, r"export async function loadProjectGraph\(root\) \{.*?\n\}\n\nexport async function impactAnalysis\(root, target, maxDepth = 3\) \{", r'''export async function loadProjectGraph(root) {
            try { return await safeReadMemoryJson(root, 'project-graph.json', { optional: true }); } catch { return null; }
          }

          function graphFingerprintMatches(stat, fingerprint) {
            if (!stat || typeof fingerprint !== 'string') return false;
            const [size, mtimeMs, ctimeMs] = fingerprint.split(':').map(Number);
            if (![size, mtimeMs, ctimeMs].every(Number.isFinite)) return false;
            return stat.size === size && Math.trunc(stat.mtimeMs) === mtimeMs && Math.trunc(stat.ctimeMs) === ctimeMs;
          }

          export async function inspectProjectGraphHealth(root, suppliedGraph = null) {
            const graph = suppliedGraph || await loadProjectGraph(root);
            if (!graph) return { available: false, totalNodes: 0, freshNodes: 0, staleNodes: 0, missingNodes: 0, truncated: false, current: false, complete: false, healthy: false, state: 'missing' };
            let freshNodes = 0;
            let staleNodes = 0;
            let missingNodes = 0;
            for (const node of graph.nodes || []) {
              let stat = null;
              try { stat = await fs.lstat(path.join(root, node.path)); } catch {}
              if (!stat?.isFile() || stat.isSymbolicLink()) { missingNodes += 1; continue; }
              if (!graphFingerprintMatches(stat, node.fingerprint)) { staleNodes += 1; continue; }
              freshNodes += 1;
            }
            const truncated = Boolean(graph.summary?.truncated);
            const current = staleNodes === 0 && missingNodes === 0;
            const complete = !truncated;
            const healthy = current && complete;
            const state = !current ? 'stale' : !complete ? 'incomplete' : 'healthy';
