name: Real Corpus Validation

on:
  pull_request:
    paths:
      - 'src/real-corpus.js'
      - 'src/real-corpus-execution.js'
      - 'scripts/real-corpus.js'
      - 'corpus/**'
      - 'tests/real-corpus.test.js'
      - 'tests/real-corpus-execution.test.js'
      - 'tests/real-corpus-transport.test.js'
      - 'docs/REAL_CORPUS_VALIDATION.md'
      - '.github/workflows/real-corpus.yml'
  push:
    branches:
      - 'agent/evidence-execution-hardening'
    paths:
      - 'src/real-corpus.js'
      - 'src/real-corpus-execution.js'
      - 'scripts/real-corpus.js'
      - 'corpus/**'
      - 'tests/real-corpus.test.js'
      - 'tests/real-corpus-execution.test.js'
      - 'tests/real-corpus-transport.test.js'
      - 'docs/REAL_CORPUS_VALIDATION.md'
      - '.github/workflows/real-corpus.yml'
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: real-corpus-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: Offline corpus contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Validate pinned manifest
        run: node scripts/real-corpus.js validate --manifest corpus/real-repositories.json
      - name: Validate no-target-execution plan
        run: node scripts/real-corpus.js plan --manifest corpus/real-repositories.json --json
      - name: Test corpus runner contract
        run: node --test tests/real-corpus.test.js tests/real-corpus-execution.test.js tests/real-corpus-transport.test.js

  external-real:
    name: Pinned external repositories
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/agent/evidence-execution-hardening')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Probe self-host context capture modes
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          checkout="$RUNNER_TEMP/self-host-context-probe"
          git init --quiet "$checkout"
          git -C "$checkout" remote add origin https://github.com/lenhonbp/codex-memory-intelligence.git
          git -C "$checkout" fetch --quiet origin refs/heads/main
          git -C "$checkout" checkout --quiet --detach b19054f329c81e1e1aefcfe08e0236922cab4acf
          node "$GITHUB_WORKSPACE/src/cli-entry.js" init "$checkout" >/dev/null
          node "$GITHUB_WORKSPACE/src/cli-entry.js" scan "$checkout" --full --json >/dev/null
          node "$GITHUB_WORKSPACE/src/cli-entry.js" scan "$checkout" --json >/dev/null
          node "$GITHUB_WORKSPACE/src/cli-entry.js" doctor "$checkout" --json >/dev/null
          stdout="$RUNNER_TEMP/shell-context.stdout"
          stderr="$RUNNER_TEMP/shell-context.stderr"
          (cd "$checkout" && node "$GITHUB_WORKSPACE/src/cli-entry.js" context 'portable evidence provenance handoff' --json > "$stdout" 2> "$stderr")
          PROBE_CHECKOUT="$checkout" PROBE_ENTRY="$GITHUB_WORKSPACE/src/cli-entry.js" SHELL_STDOUT="$stdout" SHELL_STDERR="$stderr" node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { spawnSync } from 'node:child_process';
          function shape(stdout, stderr, status, error = null) {
            const trimmed = String(stdout || '').trim();
            let parseOk = false;
            try { JSON.parse(trimmed); parseOk = true; } catch {}
            return {
              status,
              errorCode: error?.code || null,
              stdoutBytes: Buffer.byteLength(String(stdout || '')),
              stdoutLines: stdout ? String(stdout).split(/\r?\n/).length : 0,
              stdoutFirstCodePoint: trimmed ? trimmed.codePointAt(0) : null,
              stdoutLastCodePoint: trimmed ? trimmed.codePointAt(trimmed.length - 1) : null,
              stdoutStartsJsonContainer: trimmed.startsWith('{') || trimmed.startsWith('['),
              stdoutEndsJsonContainer: trimmed.endsWith('}') || trimmed.endsWith(']'),
              stdoutJsonParseOk: parseOk,
              stderrBytes: Buffer.byteLength(String(stderr || '')),
            };
          }
          const shellOut = fs.readFileSync(process.env.SHELL_STDOUT, 'utf8');
          const shellErr = fs.readFileSync(process.env.SHELL_STDERR, 'utf8');
          const spawned = spawnSync(process.execPath, [process.env.PROBE_ENTRY, 'context', 'portable evidence provenance handoff', '--json'], {
            cwd: process.env.PROBE_CHECKOUT,
            encoding: 'utf8',
            timeout: 180000,
            maxBuffer: 16 * 1024 * 1024,
            env: { ...process.env },
          });
          console.log(JSON.stringify({
            shell: shape(shellOut, shellErr, 0),
            spawnSync: shape(spawned.stdout, spawned.stderr, spawned.status, spawned.error),
          }, null, 2));
          NODE
      - name: Run engineering validation on exact Git SHAs
        id: corpus
        continue-on-error: true
        run: node scripts/real-corpus.js run --manifest corpus/real-repositories.json --work-root "$RUNNER_TEMP/real-corpus" --keep-checkouts --json > real-corpus-report.json
      - name: Upload bounded engineering report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-corpus-report
          path: real-corpus-report.json
          if-no-files-found: error
      - name: Enforce corpus result after preserving report
        if: steps.corpus.outcome != 'success'
        run: |
          echo 'Real corpus validation failed; inspect the uploaded real-corpus-report artifact.' >&2
          exit 1
