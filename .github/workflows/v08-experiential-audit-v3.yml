name: CMI v0.8 experiential audit v3

on:
  push:
    branches:
      - audit/v08-experiential-20260807

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false
      - name: Recalibrate audit-only assertions and MCP teardown
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/experiential-audit.js')
          s = p.read_text()
          replacements = [
            ("""  async function close() {\n    lines.close();\n    child.kill();\n    await new Promise((resolve) => child.once('close', resolve));\n  }""", """  async function close() {\n    lines.close();\n    if (child.exitCode !== null || child.signalCode !== null) return;\n    const closed = new Promise((resolve) => child.once('close', resolve));\n    child.kill();\n    await Promise.race([closed, new Promise((resolve) => setTimeout(resolve, 1500))]);\n    if (child.exitCode === null && child.signalCode === null) child.kill('SIGKILL');\n  }"""),
            ("""  const stack = (scan.stack || []).map((item) => String(item).toLowerCase());\n  for (const expected of ['javascript', 'typescript', 'python', 'go', 'rust']) assert.ok(stack.some((item) => item.includes(expected)), `missing stack ${expected}: ${stack.join(', ')}`);""", """  const languages = new Set((scan.languages || []).map((item) => String(item.language)));\n  for (const expected of ['JavaScript', 'TypeScript', 'Python', 'Go', 'Rust']) assert.ok(languages.has(expected), `missing indexed language ${expected}: ${[...languages].join(', ')}`);"""),
            ("""  assert.equal(baseline.projectClean ?? baseline.clean, true);\n  assert.ok(!containsText(baseline, root));""", """  assert.ok((baseline.changes || []).every((item) => String(item.path || '').startsWith('.codex-memory')), `unexpected product dirtiness: ${JSON.stringify(baseline.changes)}`);\n  assert.ok(!containsText(baseline, root));"""),
            ("""  cmiRun(['remember', 'fact', sourceMarker, '--source', 'src/util.js']);\n  const search = cmiJson(['search', sourceMarker, '--json']);\n  assert.ok(containsText(search, sourceMarker));\n  const match = findObject(search, (item) => typeof item.id === 'string' && containsText(item, sourceMarker));\n  assert.ok(match?.id, 'search result did not expose a memory id');\n  sourceMemoryId = match.id;""", """  const remembered = cmiRun(['remember', 'fact', sourceMarker, '--source', 'src/util.js']).stdout;\n  sourceMemoryId = remembered.match(/[0-9a-f]{8}/i)?.[0] || null;\n  assert.ok(sourceMemoryId, `remember output did not expose a usable prefix: ${remembered}`);\n  const search = cmiJson(['search', sourceMarker, '--json']);\n  assert.ok(containsText(search, sourceMarker));"""),
            ("""  cmiRun(['remember', 'decision', inactiveMarker]);\n  const search = cmiJson(['search', inactiveMarker, '--json']);\n  const match = findObject(search, (item) => typeof item.id === 'string' && containsText(item, inactiveMarker));\n  assert.ok(match?.id);\n  inactiveMemoryId = match.id;""", """  const remembered = cmiRun(['remember', 'decision', inactiveMarker]).stdout;\n  inactiveMemoryId = remembered.match(/[0-9a-f]{8}/i)?.[0] || null;\n  assert.ok(inactiveMemoryId, `remember output did not expose a usable prefix: ${remembered}`);\n  const search = cmiJson(['search', inactiveMarker, '--json']);\n  assert.ok(containsText(search, inactiveMarker));"""),
            ("""  for (const key of ['repository', 'boundaries', 'impact', 'risks', 'verification']) assert.ok(hasKey(brief, key), `prepare output missing ${key}`);""", """  for (const key of ['baseline', 'boundaries', 'impact', 'risks', 'verification']) assert.ok(hasKey(brief, key), `prepare output missing ${key}`);"""),
            ("""  assert.equal(handoff?.repository?.clean, true);""", """  if (handoff?.repository?.clean !== true) {\n    const raw = run('git', ['status', '--porcelain=v1'], { cwd: project }).stdout;\n    console.log('NO_CODE_HANDOFF_REPOSITORY=' + JSON.stringify(handoff?.repository));\n    console.log('NO_CODE_RAW_GIT_STATUS=' + JSON.stringify(raw));\n  }\n  assert.equal(handoff?.repository?.clean, true);"""),
          ]
          for old, new in replacements:
              if old not in s:
                  raise SystemExit('expected audit snippet not found:\n' + old[:120])
              s = s.replace(old, new)
          p.write_text(s)
          PY
      - name: Pack exact candidate package surface
        id: pack
        shell: bash
        run: |
          set -euo pipefail
          tarball="$(npm pack --ignore-scripts --silent)"
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"
      - name: Exercise installed package end to end
        shell: bash
        run: |
          set -euo pipefail
          timeout 300s node scripts/experiential-audit.js "$PWD/${{ steps.pack.outputs.tarball }}"
