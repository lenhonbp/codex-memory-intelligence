name: CMI v0.8 experiential extended
on:
  push:
    branches: [audit/v08-experiential-20260807]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false
      - name: Pack and run extended installed-package audit
        shell: bash
        run: |
          set -euo pipefail
          tarball="$(npm pack --ignore-scripts --silent)"
          timeout 300s node scripts/experiential-audit-extended.js "$PWD/$tarball"
