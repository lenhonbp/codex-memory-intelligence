name: Recover v0.8.1 trust hardening

on:
  push:
    branches:
      - "v0.8.1/trust-security-hardening"

permissions:
  contents: write

jobs:
  recover:
    if: github.actor == 'lenhonbp'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: "24.9.0"
          package-manager-cache: false
      - name: Apply corrected hardening patch and verify
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/v081-hardening-apply.yml').read_text()
          start = source.index("          from pathlib import Path\n", source.index("python3 - <<'PY'"))
          end = source.index("\n          PY\n", start)
          script = source[start:end]
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in script.splitlines())
          bad = "''').replace(\"{ recursive: True } if False else { recursive: true }\", \"{ recursive: true }\")"
          good = "'''.replace(\"{ recursive: True } if False else { recursive: true }\", \"{ recursive: true }\"))"
          if bad not in script:
              raise SystemExit('expected lease-lock recovery anchor not found')
          script = script.replace(bad, good, 1)
          # The embedded patch removes the original helper. Keep recovery cleanup explicit too.
          script = script.replace("Path('.github/workflows/v081-hardening-apply.yml').unlink()", "Path('.github/workflows/v081-hardening-apply.yml').unlink(missing_ok=True)")
          Path('/tmp/v081-apply.py').write_text(script)
          PY
          python3 /tmp/v081-apply.py
          rm -f .github/workflows/v081-hardening-recover.yml
          npm run verify
          npm run benchmark:smoke
          npm run package:smoke
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: harden v0.8.1 evidence and storage trust"
          git push origin HEAD:"v0.8.1/trust-security-hardening"
