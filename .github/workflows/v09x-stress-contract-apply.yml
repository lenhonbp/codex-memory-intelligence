name: Apply v0.9.x controlled-stress evaluation

on:
  push:
    paths:
      - '.github/workflows/v09x-stress-contract-apply.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: v0.9x/real-repo-evaluation
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Apply product patch
        run: python3 scripts/.v09x_stress_patch.py
      - name: Remove temporary helpers
        run: rm -f scripts/.v09x_stress_patch.py .github/workflows/v09x-stress-contract.yml .github/workflows/v09x-stress-contract-apply.yml
      - name: Verify repository
        run: npm run verify
      - name: Benchmark
        run: npm run benchmark:smoke
      - name: Package smoke
        run: npm run package:smoke
      - name: Check diff discipline
        run: |
          test "$(node -p "require('./package.json').version")" = "0.9.0"
          test "$(node src/cli-entry.js --version)" = "0.9.0"
          git diff --check
      - name: Commit validated product tree
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: add controlled-stress evaluation contract'
      - name: Push validated product tree
        run: git push origin HEAD:v0.9x/real-repo-evaluation
