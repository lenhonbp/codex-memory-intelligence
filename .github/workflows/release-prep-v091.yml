name: Prepare v0.9.1 public release

on:
  push:
    branches:
      - release-prep/v0.9.1-public

permissions:
  contents: write

jobs:
  prepare:
    if: github.actor == 'lenhonbp'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: release-prep/v0.9.1-public
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Prepare release metadata and docs
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const version = '0.9.1';
          const date = '2026-08-08';

          const pkgPath = 'package.json';
          const pkg = JSON.parse(fs.readFileSync(pkgPath, 'utf8'));
          if (pkg.version !== '0.9.0') throw new Error(`Expected package version 0.9.0, got ${pkg.version}`);
          pkg.version = version;
          fs.writeFileSync(pkgPath, `${JSON.stringify(pkg, null, 2)}\n`);

          const versionPath = 'src/version.js';
          let versionJs = fs.readFileSync(versionPath, 'utf8');
          if (!versionJs.includes("export const VERSION = '0.9.0';")) throw new Error('Unexpected src/version.js baseline');
          versionJs = versionJs.replace("export const VERSION = '0.9.0';", `export const VERSION = '${version}';`);
          fs.writeFileSync(versionPath, versionJs);

          const changelogPath = 'CHANGELOG.md';
          let changelog = fs.readFileSync(changelogPath, 'utf8');
          const unreleasedHeading = '## [Unreleased]';
          const previousHeading = '## [0.9.0] - 2026-08-08';
          const unreleasedStart = changelog.indexOf(unreleasedHeading);
          const previousStart = changelog.indexOf(previousHeading);
          if (unreleasedStart < 0 || previousStart < 0 || previousStart <= unreleasedStart) throw new Error('Unexpected changelog release layout');
          const unreleasedBody = changelog.slice(unreleasedStart + unreleasedHeading.length, previousStart).trim();
          if (!unreleasedBody || /No unreleased changes yet\./i.test(unreleasedBody)) throw new Error('Expected substantive unreleased v0.9.x content');
          const fixed = `### Fixed\n\n- Hardened portable evaluation bundle imports against path/file TOCTOU races by opening the descriptor first, using \`O_NOFOLLOW\` when available, validating the opened regular file and bounded size before reading, and using post-open identity checks on fallback platforms.\n- Added regression coverage that rejects symlinked portable evaluation bundles before evidence is read.`;
          const releaseSection = `## [Unreleased]\n\nNo unreleased changes yet.\n\n## [${version}] - ${date}\n\n${unreleasedBody}\n\n${fixed}\n\n`;
          changelog = `${changelog.slice(0, unreleasedStart)}${releaseSection}${changelog.slice(previousStart)}`;
          fs.writeFileSync(changelogPath, changelog);

          const readmePath = 'README.md';
          let readme = fs.readFileSync(readmePath, 'utf8');
          const oldStatus = '`v0.9.0` is the current source release line for **Evidence Integrity**. It adds unified evidence health, Git-history continuity guardrails for change/session attribution, runtime durable-contract validation, and CI-enforced schema/runtime parity on top of the v0.8 trust hardening, Behavioral Change Intelligence, and Session Continuation layers. The npm badge above remains the authoritative indicator of the version currently published to the registry.';
          const newStatus = '`v0.9.1` is the current release line for **Evidence Integrity + Real-Repository Evaluation**. It includes unified evidence health, Git-history continuity guardrails, runtime durable-contract validation, controlled external-real stress evidence, post-hoc review, longitudinal human/agent evaluation outcomes, repeated-repository aggregation, and portable anonymized evaluation corpus exchange. The npm badge above remains the authoritative indicator of the version currently published to the registry.';
          if (!readme.includes(oldStatus)) throw new Error('Unexpected README current-status baseline');
          readme = readme.replace(oldStatus, newStatus);
          const oldEval = 'The unreleased v0.9.x evaluation foundation keeps field evidence separate from ordinary regression tests and exposes the same contract through CLI plus the session-aware MCP adapter.';
          const newEval = 'v0.9.1 adds the real-repository evaluation foundation while keeping field evidence separate from ordinary regression tests and exposing the same contract through CLI plus the session-aware MCP adapter.';
          if (!readme.includes(oldEval)) throw new Error('Unexpected README evaluation baseline');
          readme = readme.replace(oldEval, newEval);
          fs.writeFileSync(readmePath, readme);

          const releasingPath = 'docs/RELEASING.md';
          let releasing = fs.readFileSync(releasingPath, 'utf8');
          releasing = releasing.replaceAll('v0.8.0', 'v0.9.1');
          fs.writeFileSync(releasingPath, releasing);
          NODE

          rm .github/workflows/release-prep-v091.yml
          git diff --check
      - name: Verify release candidate
        run: |
          npm run verify
          npm run benchmark:smoke
          npm run package:smoke
          npm run release:check -- v0.9.1
      - name: Commit validated release preparation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json src/version.js CHANGELOG.md README.md docs/RELEASING.md .github/workflows/release-prep-v091.yml
          git commit -m "chore: prepare v0.9.1 public release"
          git push origin HEAD:release-prep/v0.9.1-public
