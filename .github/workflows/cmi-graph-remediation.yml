name: One-shot CMI graph-drift remediation

on:
  push:
    branches:
      - agent/context-aware-graph-drift
    paths:
      - .github/workflows/cmi-graph-remediation.yml

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/context-aware-graph-drift
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Apply context-aware graph-drift remediation
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one replacement target, found {count}")
              p.write_text(text.replace(old, new, 1))

          replace_once(
              'src/graph.js',
              '''  let freshNodes = 0;
          let staleNodes = 0;
          let missingNodes = 0;
          for (const node of graph.nodes || []) {
            let stat = null;
            try { stat = await fs.lstat(path.join(root, node.path)); } catch {}
            if (!stat?.isFile() || stat.isSymbolicLink()) { missingNodes += 1; continue; }
            if (!graphFingerprintMatches(stat, node.fingerprint)) { staleNodes += 1; continue; }
            freshNodes += 1;
          }
          ''',
              '''  let freshNodes = 0;
          let staleNodes = 0;
          let missingNodes = 0;
          const stalePaths = [];
          const missingPaths = [];
          for (const node of graph.nodes || []) {
            let stat = null;
            try { stat = await fs.lstat(path.join(root, node.path)); } catch {}
            if (!stat?.isFile() || stat.isSymbolicLink()) { missingNodes += 1; missingPaths.push(node.path); continue; }
            if (!graphFingerprintMatches(stat, node.fingerprint)) { staleNodes += 1; stalePaths.push(node.path); continue; }
            freshNodes += 1;
          }
          ''')

          replace_once(
              'src/graph.js',
              '''    staleNodes,
              missingNodes,
              truncated,
          ''',
              '''    staleNodes,
              missingNodes,
              stalePaths: stalePaths.slice(0, 200),
              missingPaths: missingPaths.slice(0, 200),
              truncated,
          ''')

          replace_once(
              'src/evidence-health.js',
              '''    staleNodes: finiteCount(graphHealth.staleNodes),
              missingNodes: finiteCount(graphHealth.missingNodes),
              truncated: Boolean(graphHealth.truncated),
          ''',
              '''    staleNodes: finiteCount(graphHealth.staleNodes),
              missingNodes: finiteCount(graphHealth.missingNodes),
              stalePaths: (graphHealth.stalePaths || []).slice(0, 200),
              missingPaths: (graphHealth.missingPaths || []).slice(0, 200),
              truncated: Boolean(graphHealth.truncated),
          ''')

          replace_once(
              'src/session-intelligence.js',
              '''export function classifySessionGraphEvidence(project = {}) {
            if (!project.initialized) return 'uninitialized';
            const graph = project.graph;
            if (!graph || graph.state === 'missing') return 'missing';
            if (graph.available === false) return 'unavailable';
            if (graph.current !== true) return 'drifted';
            return 'current';
          }

          function detectFindings({ record, current, relatedActive, concurrentActive, completedDetails, scopePaths, mutationPaths, staleReport, gitContinuity }) {
          ''',
              '''export function classifySessionGraphEvidence(project = {}) {
            if (!project.initialized) return 'uninitialized';
            const graph = project.graph;
            if (!graph || graph.state === 'missing') return 'missing';
            if (graph.available === false) return 'unavailable';
            if (graph.current !== true) return 'drifted';
            return 'current';
          }
          function graphStructuralDriftSignals(graph = {}) {
            return [
              graph.sourceSetChanged ? 'source-set drift' : null,
              graph.resolverInputsChanged ? 'resolver-config drift' : null,
              graph.workspaceInputsChanged ? 'workspace-manifest drift' : null,
              graph.scanConfigChanged ? 'scan/ignore-config drift' : null,
              graph.freshnessUnknown ? 'unverified discovery state' : null,
              (graph.discoveryUnreadable || 0) > 0 ? 'unreadable discovery inputs' : null,
              graph.rebuildRequired ? 'generated-format rebuild required' : null,
              graph.formatStatus && graph.formatStatus !== 'current' ? `graph format ${graph.formatStatus}` : null,
            ].filter(Boolean);
          }
          function isExpectedSessionSourceGraphDrift(record, graph, mutationPaths) {
            if (classifySessionGraphEvidence(record.start?.project) !== 'current') return false;
            if (!graph || graph.current === true || graph.available === false) return false;
            if ((graph.staleNodes || 0) <= 0 || (graph.missingNodes || 0) > 0) return false;
            if (graphStructuralDriftSignals(graph).length) return false;
            const stalePaths = (graph.stalePaths || []).map(slash);
            if (!stalePaths.length || stalePaths.length !== graph.staleNodes) return false;
            const mutationSet = new Set((mutationPaths || []).map(slash));
            return stalePaths.every((item) => mutationSet.has(item));
          }

          function detectFindings({ record, current, relatedActive, concurrentActive, completedDetails, scopePaths, mutationPaths, staleReport, gitContinuity }) {
          ''')

          replace_once(
              'src/session-intelligence.js',
              '''  } else if (graphEvidence === 'drifted') {
            findings.push(makeFinding('graph-drift', graph.missingNodes > 0 ? 'high' : 'medium', 'Project graph has drifted from source', `Stored graph evidence no longer matches current source (${graph.staleNodes || 0} stale, ${graph.missingNodes || 0} missing node(s)).`, { target: 'graph', evidence: ['source-fingerprint-mismatch'] }));
          }
          ''',
              '''  } else if (graphEvidence === 'drifted') {
            const expectedSessionDrift = isExpectedSessionSourceGraphDrift(record, graph, mutationPaths);
            const structuralSignals = graphStructuralDriftSignals(graph);
            const relatedGraphPaths = bounded(unique([...(graph.stalePaths || []), ...(graph.missingPaths || [])]), 30);
            findings.push(makeFinding(
              'graph-drift',
              expectedSessionDrift ? 'low' : graph.missingNodes > 0 ? 'high' : 'medium',
              expectedSessionDrift ? 'Project graph needs refresh after current-session source changes' : 'Project graph has drifted from source',
              expectedSessionDrift
                ? `Stored graph evidence is stale because ${graph.staleNodes || 0} source node(s) changed within this session's attributed mutation scope. Refresh before future graph/impact use; this does not by itself indicate a product problem.`
                : `Stored graph evidence no longer matches current source (${graph.staleNodes || 0} stale, ${graph.missingNodes || 0} missing node(s)${structuralSignals.length ? `; ${structuralSignals.join(', ')}` : ''}).`,
              {
                target: 'graph',
                evidence: expectedSessionDrift ? ['source-fingerprint-mismatch', 'session-source-mutation'] : ['source-fingerprint-mismatch'],
                relatedFiles: relatedGraphPaths,
                sessionRelevance: expectedSessionDrift ? 'related' : null,
              },
            ));
          }
          ''')

          replace_once(
              'src/session-intelligence.js',
              '''function priorityFor(finding) {
            if (finding.category === 'active-change' && finding.sessionRelevance === 'concurrent-unattributed') return 'P3';
            if (finding.category === 'verification-failed' || finding.category === 'session-blocker') return 'P0';
          ''',
              '''function priorityFor(finding) {
            if (finding.category === 'active-change' && finding.sessionRelevance === 'concurrent-unattributed') return 'P3';
            if (finding.category === 'graph-drift' && finding.severity === 'low' && (finding.evidence || []).includes('session-source-mutation')) return 'P3';
            if (finding.category === 'verification-failed' || finding.category === 'session-blocker') return 'P0';
          ''')

          replace_once(
              'src/session-intelligence.js',
              '''function actionFor(finding) {
            if (finding.category === 'active-change' && finding.sessionRelevance === 'concurrent-unattributed') return 'Coordinate the concurrent active change only if it becomes relevant to this session; do not block current work on it by default.';
            const actions = {
          ''',
              '''function actionFor(finding) {
            if (finding.category === 'active-change' && finding.sessionRelevance === 'concurrent-unattributed') return 'Coordinate the concurrent active change only if it becomes relevant to this session; do not block current work on it by default.';
            if (finding.category === 'graph-drift' && finding.severity === 'low' && (finding.evidence || []).includes('session-source-mutation')) return 'Refresh project intelligence with `cmi scan` before the next graph/impact-dependent task; do not scan merely to make Closing Intelligence CLEAN.';
            const actions = {
          ''')

          replace_once(
              'src/closing-intelligence.js',
              '''function levelForFinding(finding) {
            if (finding.state === 'accepted') return 'info';
          ''',
              '''function levelForFinding(finding) {
            if (finding.state === 'accepted') return 'info';
            if (finding.category === 'graph-drift' && finding.severity === 'low' && (finding.evidence || []).includes('session-source-mutation')) return 'reminder';
          ''')

          replace_once(
              'src/activation.js',
              '''- Treat CMI intent classification, boundaries, impact, history, findings, and recommendations as advisory evidence, not authorization or product truth.
          ''',
              '''- Treat CMI intent classification, boundaries, impact, history, findings, and recommendations as advisory evidence, not authorization or product truth.
          - If project evidence reports a stale graph, do not rely on graph/impact output as current evidence. When an upcoming task actually needs graph/impact evidence, refresh project intelligence through the supported scan surface first. Do not scan merely to make Closing Intelligence CLEAN; source-only drift caused by the just-completed attributed session may be surfaced as a non-blocking refresh reminder.
          ''')

          old_test = '''test('graph drift and uncaptured changed scope produce evidence-based next actions', async () => {
            const root = await gitFixture();
            if (!root) return;
            const session = await startSession(root, 'change service behavior');
            await fs.writeFile(path.join(root, 'src', 'service.js'), 'export function service() { return false; }\\n');

            const live = await assessSession(root, session.id);
            assert.ok(live.findings.some((item) => item.category === 'graph-drift'));

            const closed = await closeSession(root, session.id, { files: ['src/service.js'] });
            const categories = new Set(closed.close.findings.map((item) => item.category));
            assert.ok(categories.has('graph-drift'));
            assert.ok(categories.has('uncaptured-session-change'));
            assert.ok(closed.close.recommendations.some((item) => item.priority === 'P1' && /cmi scan/i.test(item.action)));
            assert.ok(closed.close.guardrails.some((item) => item.id === 'do-not-trust-stale-graph'));
            assert.equal(closed.close.outcome, 'partial');
          });
          '''
          new_tests = '''test('same-session source drift is a non-blocking refresh reminder while uncaptured change remains material', async () => {
            const root = await gitFixture();
            if (!root) return;
            const session = await startSession(root, 'change service behavior');
            await fs.writeFile(path.join(root, 'src', 'service.js'), 'export function service() { return false; }\\n');

            const live = await assessSession(root, session.id);
            const drift = live.findings.find((item) => item.category === 'graph-drift');
            assert.ok(drift);
            assert.equal(drift.severity, 'low');
            assert.ok(drift.evidence.includes('session-source-mutation'));
            assert.deepEqual(drift.relatedFiles, ['src/service.js']);
            assert.ok(live.recommendations.some((item) => item.priority === 'P3' && /cmi scan/i.test(item.action)));

            const closed = await closeSession(root, session.id, { files: ['src/service.js'] });
            const closedDrift = closed.close.findings.find((item) => item.category === 'graph-drift');
            const categories = new Set(closed.close.findings.map((item) => item.category));
            assert.ok(closedDrift);
            assert.equal(closedDrift.severity, 'low');
            assert.ok(categories.has('uncaptured-session-change'));
            assert.ok(closed.close.recommendations.some((item) => item.priority === 'P1' && /change record/i.test(item.action)));
            assert.ok(closed.close.guardrails.some((item) => item.id === 'do-not-trust-stale-graph'));
            assert.equal(closed.close.outcome, 'partial');
          });

          test('graph drift that predates the session remains a material P1 finding', async () => {
            const root = await gitFixture();
            if (!root) return;
            await fs.writeFile(path.join(root, 'src', 'service.js'), 'export function service() { return false; }\\n');
            const session = await startSession(root, 'inspect already-stale intelligence');
            const live = await assessSession(root, session.id);
            const drift = live.findings.find((item) => item.category === 'graph-drift');
            assert.ok(drift);
            assert.equal(drift.severity, 'medium');
            assert.ok(!drift.evidence.includes('session-source-mutation'));
            assert.ok(live.recommendations.some((item) => item.priority === 'P1' && /cmi scan/i.test(item.action)));
          });

          test('source-set graph drift remains material even when introduced during the session', async () => {
            const root = await gitFixture();
            if (!root) return;
            const session = await startSession(root, 'add another source module');
            await fs.writeFile(path.join(root, 'src', 'extra.js'), 'export const extra = true;\\n');
            const live = await assessSession(root, session.id);
            const drift = live.findings.find((item) => item.category === 'graph-drift');
            assert.ok(drift);
            assert.equal(drift.severity, 'medium');
            assert.ok(!drift.evidence.includes('session-source-mutation'));
            assert.ok(live.current.project.graph.sourceSetChanged);
            assert.ok(live.recommendations.some((item) => item.priority === 'P1' && /cmi scan/i.test(item.action)));
          });
          '''
          replace_once('tests/session-intelligence.test.js', old_test, new_tests)

          replace_once(
              'tests/closing-intelligence.test.js',
              '''test('reviewed UI rule is surfaced as applicability evidence without inventing a Figma violation', async () => {
          ''',
              '''test('same-session source-only graph drift closes as a non-blocking refresh reminder', async () => {
            const root = await fixture();
            const session = await startSession(root, 'update feature A implementation');
            await fs.appendFile(path.join(root, 'src', 'feature-a.js'), 'export const updatedFeatureA = true;\\n');
            await closeSession(root, session.id, { outcome: 'partial', files: ['src/feature-a.js'] });
            const closing = await buildClosingIntelligence(root, session.id);
            const drift = closing.alerts.find((item) => item.kind === 'graph-drift');
            assert.ok(drift);
            assert.equal(drift.severity, 'reminder');
            assert.equal(drift.violationEstablished, false);
            assert.ok(drift.evidence.includes('session-source-mutation'));
          });

          test('reviewed UI rule is surfaced as applicability evidence without inventing a Figma violation', async () => {
          ''')

          replace_once(
              'tests/closing-intelligence.test.js',
              '''  assert.match(agents, /not proof of a violation/i);
          });
          ''',
              '''  assert.match(agents, /not proof of a violation/i);
            assert.match(agents, /do not rely on graph\\/impact output as current evidence/i);
            assert.match(agents, /do not scan merely to make Closing Intelligence CLEAN/i);
          });
          ''')

          replace_once(
              'docs/CLOSING_INTELLIGENCE.md',
              '''CMI does not block a user from changing priorities. Carryover work is a reminder unless stronger evidence makes it directly relevant or blocking.
          ''',
              '''CMI does not block a user from changing priorities. Carryover work is a reminder unless stronger evidence makes it directly relevant or blocking.

          ## Graph freshness at close

          Repository source edits normally invalidate generated graph fingerprints. CMI keeps the graph itself honestly stale until `cmi scan` rebuilds generated intelligence; Closing Intelligence does not mark stale graph evidence current or auto-scan merely to produce a clean footer.

          When a session started from a current graph and every stale graph node is explained by that session's attributed source mutation scope, with no missing nodes, source-set drift, resolver/workspace drift, scan-policy drift, unreadable discovery input, or generated-format problem, Closing Intelligence treats the condition as a non-blocking refresh reminder rather than a material graph-drift warning. The reminder still means graph/impact evidence must be refreshed before the next task relies on it.

          Drift that predates the session, changes graph structure/configuration, contains missing nodes, or cannot be explained by the current session remains a material warning and keeps the existing `cmi scan` recovery action.
          ''')

          replace_once(
              'docs/EVIDENCE_INTEGRITY.md',
              '''A current but truncated graph is `degraded` and graph/impact capability is `partial`. A stale/missing graph is `blocked` for graph/impact current-evidence claims. Stale or review-required memory degrades durable-memory trust without pretending all local historical evidence is unusable.
          ''',
              '''A current but truncated graph is `degraded` and graph/impact capability is `partial`. A stale/missing graph is `blocked` for graph/impact current-evidence claims. Stale or review-required memory degrades durable-memory trust without pretending all local historical evidence is unusable.

          Session/Closing presentation may classify one narrow stale-graph case as a non-blocking refresh reminder: the session started with current graph evidence, every stale node path is inside the session's attributed mutation scope, and no structural/configuration/discovery drift is present. This does not change Evidence Health: the graph remains stale and graph/impact capability remains blocked until `cmi scan`. Pre-existing, unexplained, missing-node, source-set, resolver/workspace, scan-policy, discovery, or format drift remains material.
          ''')
          PY
      - name: Verify remediation
        run: npm run verify
      - name: Verify package smoke
        run: npm run package:smoke
      - name: Commit remediation
        shell: bash
        run: |
          git config user.name "CMI remediation bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/graph.js src/evidence-health.js src/session-intelligence.js src/closing-intelligence.js src/activation.js tests/session-intelligence.test.js tests/closing-intelligence.test.js docs/CLOSING_INTELLIGENCE.md docs/EVIDENCE_INTEGRITY.md
          git diff --cached --check
          git commit -m "fix: classify expected graph drift as refresh reminder"
          git push origin HEAD:agent/context-aware-graph-drift
