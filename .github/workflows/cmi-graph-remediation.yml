name: One-shot CMI graph-drift remediation

on:
  push:
    branches:
      - agent/context-aware-graph-drift
    paths:
      - .github/workflows/cmi-graph-remediation.yml

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/context-aware-graph-drift
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Apply context-aware graph-drift remediation
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one replacement target, found {count}")
              p.write_text(text.replace(old, new, 1))

          def replace_regex_once(path, pattern, replacement):
              p = Path(path)
              text = p.read_text()
              next_text, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one regex target, found {count}")
              p.write_text(next_text)

          replace_once(
              'src/graph.js',
              "  let freshNodes = 0;\n"
              "  let staleNodes = 0;\n"
              "  let missingNodes = 0;\n"
              "  for (const node of graph.nodes || []) {\n"
              "    let stat = null;\n"
              "    try { stat = await fs.lstat(path.join(root, node.path)); } catch {}\n"
              "    if (!stat?.isFile() || stat.isSymbolicLink()) { missingNodes += 1; continue; }\n"
              "    if (!graphFingerprintMatches(stat, node.fingerprint)) { staleNodes += 1; continue; }\n"
              "    freshNodes += 1;\n"
              "  }\n",
              "  let freshNodes = 0;\n"
              "  let staleNodes = 0;\n"
              "  let missingNodes = 0;\n"
              "  const stalePaths = [];\n"
              "  const missingPaths = [];\n"
              "  for (const node of graph.nodes || []) {\n"
              "    let stat = null;\n"
              "    try { stat = await fs.lstat(path.join(root, node.path)); } catch {}\n"
              "    if (!stat?.isFile() || stat.isSymbolicLink()) { missingNodes += 1; missingPaths.push(node.path); continue; }\n"
              "    if (!graphFingerprintMatches(stat, node.fingerprint)) { staleNodes += 1; stalePaths.push(node.path); continue; }\n"
              "    freshNodes += 1;\n"
              "  }\n",
          )

          replace_once(
              'src/graph.js',
              "    staleNodes,\n    missingNodes,\n    truncated,\n",
              "    staleNodes,\n    missingNodes,\n    stalePaths: stalePaths.slice(0, 200),\n    missingPaths: missingPaths.slice(0, 200),\n    truncated,\n",
          )

          replace_once(
              'src/evidence-health.js',
              "    staleNodes: finiteCount(graphHealth.staleNodes),\n"
              "    missingNodes: finiteCount(graphHealth.missingNodes),\n"
              "    truncated: Boolean(graphHealth.truncated),\n",
              "    staleNodes: finiteCount(graphHealth.staleNodes),\n"
              "    missingNodes: finiteCount(graphHealth.missingNodes),\n"
              "    stalePaths: (graphHealth.stalePaths || []).slice(0, 200),\n"
              "    missingPaths: (graphHealth.missingPaths || []).slice(0, 200),\n"
              "    truncated: Boolean(graphHealth.truncated),\n",
          )

          classify_anchor = (
              "export function classifySessionGraphEvidence(project = {}) {\n"
              "  if (!project.initialized) return 'uninitialized';\n"
              "  const graph = project.graph;\n"
              "  if (!graph || graph.state === 'missing') return 'missing';\n"
              "  if (graph.available === false) return 'unavailable';\n"
              "  if (graph.current !== true) return 'drifted';\n"
              "  return 'current';\n"
              "}\n\n"
              "function detectFindings({ record, current, relatedActive, concurrentActive, completedDetails, scopePaths, mutationPaths, staleReport, gitContinuity }) {\n"
          )
          classify_replacement = (
              "export function classifySessionGraphEvidence(project = {}) {\n"
              "  if (!project.initialized) return 'uninitialized';\n"
              "  const graph = project.graph;\n"
              "  if (!graph || graph.state === 'missing') return 'missing';\n"
              "  if (graph.available === false) return 'unavailable';\n"
              "  if (graph.current !== true) return 'drifted';\n"
              "  return 'current';\n"
              "}\n"
              "function graphStructuralDriftSignals(graph = {}) {\n"
              "  return [\n"
              "    graph.sourceSetChanged ? 'source-set drift' : null,\n"
              "    graph.resolverInputsChanged ? 'resolver-config drift' : null,\n"
              "    graph.workspaceInputsChanged ? 'workspace-manifest drift' : null,\n"
              "    graph.scanConfigChanged ? 'scan/ignore-config drift' : null,\n"
              "    graph.freshnessUnknown ? 'unverified discovery state' : null,\n"
              "    (graph.discoveryUnreadable || 0) > 0 ? 'unreadable discovery inputs' : null,\n"
              "    graph.rebuildRequired ? 'generated-format rebuild required' : null,\n"
              "    graph.formatStatus && graph.formatStatus !== 'current' ? `graph format ${graph.formatStatus}` : null,\n"
              "  ].filter(Boolean);\n"
              "}\n"
              "function isExpectedSessionSourceGraphDrift(record, graph, mutationPaths) {\n"
              "  if (classifySessionGraphEvidence(record.start?.project) !== 'current') return false;\n"
              "  if (!graph || graph.current === true || graph.available === false) return false;\n"
              "  if ((graph.staleNodes || 0) <= 0 || (graph.missingNodes || 0) > 0) return false;\n"
              "  if (graphStructuralDriftSignals(graph).length) return false;\n"
              "  const stalePaths = (graph.stalePaths || []).map(slash);\n"
              "  if (!stalePaths.length || stalePaths.length !== graph.staleNodes) return false;\n"
              "  const mutationSet = new Set((mutationPaths || []).map(slash));\n"
              "  return stalePaths.every((item) => mutationSet.has(item));\n"
              "}\n\n"
              "function detectFindings({ record, current, relatedActive, concurrentActive, completedDetails, scopePaths, mutationPaths, staleReport, gitContinuity }) {\n"
          )
          replace_once('src/session-intelligence.js', classify_anchor, classify_replacement)

          drift_old = (
              "  } else if (graphEvidence === 'drifted') {\n"
              "    findings.push(makeFinding('graph-drift', graph.missingNodes > 0 ? 'high' : 'medium', 'Project graph has drifted from source', `Stored graph evidence no longer matches current source (${graph.staleNodes || 0} stale, ${graph.missingNodes || 0} missing node(s)).`, { target: 'graph', evidence: ['source-fingerprint-mismatch'] }));\n"
              "  }\n"
          )
          drift_new = (
              "  } else if (graphEvidence === 'drifted') {\n"
              "    const expectedSessionDrift = isExpectedSessionSourceGraphDrift(record, graph, mutationPaths);\n"
              "    const structuralSignals = graphStructuralDriftSignals(graph);\n"
              "    const relatedGraphPaths = bounded(unique([...(graph.stalePaths || []), ...(graph.missingPaths || [])]), 30);\n"
              "    findings.push(makeFinding(\n"
              "      'graph-drift',\n"
              "      expectedSessionDrift ? 'low' : graph.missingNodes > 0 ? 'high' : 'medium',\n"
              "      expectedSessionDrift ? 'Project graph needs refresh after current-session source changes' : 'Project graph has drifted from source',\n"
              "      expectedSessionDrift\n"
              "        ? `Stored graph evidence is stale because ${graph.staleNodes || 0} source node(s) changed within this session's attributed mutation scope. Refresh before future graph/impact use; this does not by itself indicate a product problem.`\n"
              "        : `Stored graph evidence no longer matches current source (${graph.staleNodes || 0} stale, ${graph.missingNodes || 0} missing node(s)${structuralSignals.length ? `; ${structuralSignals.join(', ')}` : ''}).`,\n"
              "      {\n"
              "        target: 'graph',\n"
              "        evidence: expectedSessionDrift ? ['source-fingerprint-mismatch', 'session-source-mutation'] : ['source-fingerprint-mismatch'],\n"
              "        relatedFiles: relatedGraphPaths,\n"
              "        sessionRelevance: expectedSessionDrift ? 'related' : null,\n"
              "      },\n"
              "    ));\n"
              "  }\n"
          )
          replace_once('src/session-intelligence.js', drift_old, drift_new)

          replace_once(
              'src/session-intelligence.js',
              "function priorityFor(finding) {\n"
              "  if (finding.category === 'active-change' && finding.sessionRelevance === 'concurrent-unattributed') return 'P3';\n"
              "  if (finding.category === 'verification-failed' || finding.category === 'session-blocker') return 'P0';\n",
              "function priorityFor(finding) {\n"
              "  if (finding.category === 'active-change' && finding.sessionRelevance === 'concurrent-unattributed') return 'P3';\n"
              "  if (finding.category === 'graph-drift' && finding.severity === 'low' && (finding.evidence || []).includes('session-source-mutation')) return 'P3';\n"
              "  if (finding.category === 'verification-failed' || finding.category === 'session-blocker') return 'P0';\n",
          )

          replace_once(
              'src/session-intelligence.js',
              "function actionFor(finding) {\n"
              "  if (finding.category === 'active-change' && finding.sessionRelevance === 'concurrent-unattributed') return 'Coordinate the concurrent active change only if it becomes relevant to this session; do not block current work on it by default.';\n"
              "  const actions = {\n",
              "function actionFor(finding) {\n"
              "  if (finding.category === 'active-change' && finding.sessionRelevance === 'concurrent-unattributed') return 'Coordinate the concurrent active change only if it becomes relevant to this session; do not block current work on it by default.';\n"
              "  if (finding.category === 'graph-drift' && finding.severity === 'low' && (finding.evidence || []).includes('session-source-mutation')) return 'Refresh project intelligence with `cmi scan` before the next graph/impact-dependent task; do not scan merely to make Closing Intelligence CLEAN.';\n"
              "  const actions = {\n",
          )

          replace_once(
              'src/closing-intelligence.js',
              "function levelForFinding(finding) {\n  if (finding.state === 'accepted') return 'info';\n",
              "function levelForFinding(finding) {\n  if (finding.state === 'accepted') return 'info';\n  if (finding.category === 'graph-drift' && finding.severity === 'low' && (finding.evidence || []).includes('session-source-mutation')) return 'reminder';\n",
          )

          replace_once(
              'src/activation.js',
              "- Treat CMI intent classification, boundaries, impact, history, findings, and recommendations as advisory evidence, not authorization or product truth.\n",
              "- Treat CMI intent classification, boundaries, impact, history, findings, and recommendations as advisory evidence, not authorization or product truth.\n"
              "- If project evidence reports a stale graph, do not rely on graph/impact output as current evidence. When an upcoming task actually needs graph/impact evidence, refresh project intelligence through the supported scan surface first. Do not scan merely to make Closing Intelligence CLEAN; source-only drift caused by the just-completed attributed session may be surfaced as a non-blocking refresh reminder.\n",
          )

          session_tests = r'''test('same-session source drift is a non-blocking refresh reminder while uncaptured change remains material', async () => {
            const root = await gitFixture();
            if (!root) return;
            const session = await startSession(root, 'change service behavior');
            await fs.writeFile(path.join(root, 'src', 'service.js'), 'export function service() { return false; }\n');

            const live = await assessSession(root, session.id);
            const drift = live.findings.find((item) => item.category === 'graph-drift');
            assert.ok(drift);
            assert.equal(drift.severity, 'low');
            assert.ok(drift.evidence.includes('session-source-mutation'));
            assert.deepEqual(drift.relatedFiles, ['src/service.js']);
            assert.ok(live.recommendations.some((item) => item.priority === 'P3' && /cmi scan/i.test(item.action)));

            const closed = await closeSession(root, session.id, { files: ['src/service.js'] });
            const closedDrift = closed.close.findings.find((item) => item.category === 'graph-drift');
            const categories = new Set(closed.close.findings.map((item) => item.category));
            assert.ok(closedDrift);
            assert.equal(closedDrift.severity, 'low');
            assert.ok(categories.has('uncaptured-session-change'));
            assert.ok(closed.close.recommendations.some((item) => item.priority === 'P1' && /change record/i.test(item.action)));
            assert.ok(closed.close.guardrails.some((item) => item.id === 'do-not-trust-stale-graph'));
            assert.equal(closed.close.outcome, 'partial');
          });

          test('graph drift that predates the session remains a material P1 finding', async () => {
            const root = await gitFixture();
            if (!root) return;
            await fs.writeFile(path.join(root, 'src', 'service.js'), 'export function service() { return false; }\n');
            const session = await startSession(root, 'inspect already-stale intelligence');
            const live = await assessSession(root, session.id);
            const drift = live.findings.find((item) => item.category === 'graph-drift');
            assert.ok(drift);
            assert.equal(drift.severity, 'medium');
            assert.ok(!drift.evidence.includes('session-source-mutation'));
            assert.ok(live.recommendations.some((item) => item.priority === 'P1' && /cmi scan/i.test(item.action)));
          });

          test('source-set graph drift remains material even when introduced during the session', async () => {
            const root = await gitFixture();
            if (!root) return;
            const session = await startSession(root, 'add another source module');
            await fs.writeFile(path.join(root, 'src', 'extra.js'), 'export const extra = true;\n');
            const live = await assessSession(root, session.id);
            const drift = live.findings.find((item) => item.category === 'graph-drift');
            assert.ok(drift);
            assert.equal(drift.severity, 'medium');
            assert.ok(!drift.evidence.includes('session-source-mutation'));
            assert.ok(live.current.project.graph.sourceSetChanged);
            assert.ok(live.recommendations.some((item) => item.priority === 'P1' && /cmi scan/i.test(item.action)));
          });'''
          replace_regex_once(
              'tests/session-intelligence.test.js',
              r"test\('graph drift and uncaptured changed scope produce evidence-based next actions'.*?\n\}\);(?=\n\ntest\('unresolved blockers persist)",
              session_tests,
          )

          replace_once(
              'tests/closing-intelligence.test.js',
              "import fs from 'node:fs/promises';\n",
              "import fs from 'node:fs/promises';\nimport { execFile } from 'node:child_process';\nimport { promisify } from 'node:util';\n",
          )
          replace_once(
              'tests/closing-intelligence.test.js',
              "import { activateProject } from '../src/activation.js';\n\nasync function fixture() {\n",
              "import { activateProject } from '../src/activation.js';\n\nconst execFileAsync = promisify(execFile);\n\nasync function fixture() {\n",
          )
          fixture_anchor = (
              "  await scanProject(root);\n"
              "  return root;\n"
              "}\n\n"
              "test('unfinished feature A remains visible after unrelated feature B closes, then disappears after A is completed', async () => {\n"
          )
          fixture_replacement = (
              "  await scanProject(root);\n"
              "  return root;\n"
              "}\n\n"
              "async function gitFixture() {\n"
              "  const root = await fixture();\n"
              "  try {\n"
              "    await execFileAsync('git', ['init'], { cwd: root });\n"
              "    await execFileAsync('git', ['config', 'user.email', 'test@example.com'], { cwd: root });\n"
              "    await execFileAsync('git', ['config', 'user.name', 'CMI Test'], { cwd: root });\n"
              "    await execFileAsync('git', ['add', '.'], { cwd: root });\n"
              "    await execFileAsync('git', ['commit', '-m', 'Initial'], { cwd: root });\n"
              "  } catch (error) {\n"
              "    if (error.code === 'ENOENT') return null;\n"
              "    throw error;\n"
              "  }\n"
              "  return root;\n"
              "}\n\n"
              "test('unfinished feature A remains visible after unrelated feature B closes, then disappears after A is completed', async () => {\n"
          )
          replace_once('tests/closing-intelligence.test.js', fixture_anchor, fixture_replacement)

          closing_test = r'''test('same-session source-only graph drift closes as a non-blocking refresh reminder', async () => {
            const root = await gitFixture();
            if (!root) return;
            const session = await startSession(root, 'update feature A implementation');
            await fs.appendFile(path.join(root, 'src', 'feature-a.js'), 'export const updatedFeatureA = true;\n');
            await closeSession(root, session.id, { outcome: 'partial', files: ['src/feature-a.js'] });
            const closing = await buildClosingIntelligence(root, session.id);
            const drift = closing.alerts.find((item) => item.kind === 'graph-drift');
            assert.ok(drift);
            assert.equal(drift.severity, 'reminder');
            assert.equal(drift.violationEstablished, false);
            assert.ok(drift.evidence.includes('session-source-mutation'));
          });

          '''
          replace_once(
              'tests/closing-intelligence.test.js',
              "test('reviewed UI rule is surfaced as applicability evidence without inventing a Figma violation', async () => {\n",
              closing_test + "test('reviewed UI rule is surfaced as applicability evidence without inventing a Figma violation', async () => {\n",
          )
          replace_once(
              'tests/closing-intelligence.test.js',
              "  assert.match(agents, /not proof of a violation/i);\n});\n",
              "  assert.match(agents, /not proof of a violation/i);\n  assert.match(agents, /do not rely on graph\\/impact output as current evidence/i);\n  assert.match(agents, /do not scan merely to make Closing Intelligence CLEAN/i);\n});\n",
          )

          replace_once(
              'docs/CLOSING_INTELLIGENCE.md',
              "CMI does not block a user from changing priorities. Carryover work is a reminder unless stronger evidence makes it directly relevant or blocking.\n",
              "CMI does not block a user from changing priorities. Carryover work is a reminder unless stronger evidence makes it directly relevant or blocking.\n\n"
              "## Graph freshness at close\n\n"
              "Repository source edits normally invalidate generated graph fingerprints. CMI keeps the graph itself honestly stale until `cmi scan` rebuilds generated intelligence; Closing Intelligence does not mark stale graph evidence current or auto-scan merely to produce a clean footer.\n\n"
              "When a session started from a current graph and every stale graph node is explained by that session's attributed source mutation scope, with no missing nodes, source-set drift, resolver/workspace drift, scan-policy drift, unreadable discovery input, or generated-format problem, Closing Intelligence treats the condition as a non-blocking refresh reminder rather than a material graph-drift warning. The reminder still means graph/impact evidence must be refreshed before the next task relies on it.\n\n"
              "Drift that predates the session, changes graph structure/configuration, contains missing nodes, or cannot be explained by the current session remains a material warning and keeps the existing `cmi scan` recovery action.\n",
          )

          replace_once(
              'docs/EVIDENCE_INTEGRITY.md',
              "A current but truncated graph is `degraded` and graph/impact capability is `partial`. A stale/missing graph is `blocked` for graph/impact current-evidence claims. Stale or review-required memory degrades durable-memory trust without pretending all local historical evidence is unusable.\n",
              "A current but truncated graph is `degraded` and graph/impact capability is `partial`. A stale/missing graph is `blocked` for graph/impact current-evidence claims. Stale or review-required memory degrades durable-memory trust without pretending all local historical evidence is unusable.\n\n"
              "Session/Closing presentation may classify one narrow stale-graph case as a non-blocking refresh reminder: the session started with current graph evidence, every stale node path is inside the session's attributed mutation scope, and no structural/configuration/discovery drift is present. This does not change Evidence Health: the graph remains stale and graph/impact capability remains blocked until `cmi scan`. Pre-existing, unexplained, missing-node, source-set, resolver/workspace, scan-policy, discovery, or format drift remains material.\n",
          )
          PY
      - name: Verify remediation
        run: npm run verify
      - name: Verify package smoke
        run: npm run package:smoke
      - name: Commit remediation
        shell: bash
        run: |
          git config user.name "CMI remediation bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/graph.js src/evidence-health.js src/session-intelligence.js src/closing-intelligence.js src/activation.js tests/session-intelligence.test.js tests/closing-intelligence.test.js docs/CLOSING_INTELLIGENCE.md docs/EVIDENCE_INTEGRITY.md
          git diff --cached --check
          git commit -m "fix: classify expected graph drift as refresh reminder"
          git push origin HEAD:agent/context-aware-graph-drift
