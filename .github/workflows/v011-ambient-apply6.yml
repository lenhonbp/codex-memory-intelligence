name: Apply v0.11 ambient source patch final candidate

on:
  push:
    branches:
      - feat/v0.11-ambient-agent-intelligence
    paths:
      - .github/workflows/v011-ambient-apply6.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Recover and remediate source patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap
          source = Path('.github/workflows/v011-ambient-apply3.yml').read_text()
          start = source.index("          python - <<'PY'\n") + len("          python - <<'PY'\n")
          end = source.index("\n          PY\n", start)
          script = textwrap.dedent(source[start:end])
          bad_start = script.index("replace_once('src/advisor.js', \"\"\"      clean: allChanges.length === 0,")
          bad_end = script.index("replace_once('src/advisor.js', \"if (memory.coverage.relevantDurableEntries", bad_start)
          corrected = '''replace_once('src/advisor.js', """      clean: allChanges.length === 0,\n      changes: bounded(allChanges, 200),\n      changesTruncated: allChanges.length > 200,""", """      clean: allChanges.length === 0,\n      changes: bounded(allChanges, 200),\n      changesTruncated: allChanges.length > 200,\n      rawClean: rawChanges.length === 0,\n      rawChanges: bounded(rawChanges, 200),\n      rawChangesTruncated: rawChanges.length > 200,\n      cmiInternalChangesOmitted,""")\n'''
          script = script[:bad_start] + corrected + script[bad_end:]
          Path('/tmp/apply-v011.py').write_text(script)
          PY
          python /tmp/apply-v011.py
          python - <<'PY'
          from pathlib import Path
          p = Path('src/ambient-intelligence.js')
          text = p.read_text()
          text = text.replace("'Use the retrieved evidence to understand the request, but keep the user's intent in control.'", '"Use the retrieved evidence to understand the request, but keep the user\'s intent in control."', 1)
          old = "const REVIEW = /(?:\\bổn\\s+chưa\\b|\\breview\\b|\\baudit\\b|\\bđánh\\s+giá\\b|\\bcó\\s+lỗi\\s+gì\\b|\\bwhat(?:'s|\\s+is)?\\s+wrong\\b|\\bis\\s+this\\s+(?:ok|okay|good)\\b)/iu;"
          new = "const REVIEW = /(?:ổn\\s+chưa|\\breview\\b|\\baudit\\b|đánh\\s+giá|có\\s+lỗi\\s+gì|\\bwhat(?:'s|\\s+is)?\\s+wrong\\b|\\bis\\s+this\\s+(?:ok|okay|good)\\b)/iu;"
          if old not in text:
              raise SystemExit('review routing regex target not found')
          p.write_text(text.replace(old, new, 1))
          t = Path('tests/ambient-activation.test.js')
          tests = t.read_text()
          old_assert = "assert.equal(baseline.rawChanges.some((item) => item.path.includes('.codex-memory/sessions/probe.json')), true);"
          new_assert = "assert.equal(baseline.rawChanges.some((item) => item.path.startsWith('.codex-memory/sessions/')), true);"
          if old_assert not in tests:
              raise SystemExit('raw Git assertion target not found')
          t.write_text(tests.replace(old_assert, new_assert, 1))
          PY
      - name: Syntax check
        run: |
          node --check src/activation.js
          node --check src/ambient-intelligence.js
          node --check src/core.js
          node --check src/advisor.js
          node --check src/graph.js
          node --check src/session-intelligence.js
          node --check src/cli.js
          node --check src/mcp-entry.js
          node --check tests/ambient-activation.test.js
      - name: Verify
        run: |
          npm run verify
          npm run benchmark:smoke
          npm run package:smoke
          git diff --check
      - name: Commit implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests docs README.md CHANGELOG.md
          git diff --cached --check
          git commit -m "feat: add ambient agent intelligence"
          git push origin HEAD:feat/v0.11-ambient-agent-intelligence
