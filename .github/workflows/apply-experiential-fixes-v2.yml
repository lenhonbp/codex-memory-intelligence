name: Apply experiential fixes staging
on:
  push:
    branches:
      - staging/v08-experiential-fixes
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Patch source and add regression tests
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/cli.js')
          s = p.read_text()
          needle = "  cmi change history [query] [--limit N] [--json]\\n  cmi remember <fact|decision|mistake> <text> [--source path ...]"
          replacement = "  cmi change history [query] [--limit N] [--json]\\n  cmi session <start|observe|status|close|show|list|handoff> ...\\n  cmi finding <list|show|state> ...\\n  cmi remember <fact|decision|mistake> <text> [--source path ...]"
          if needle not in s: raise SystemExit('top-level help insertion point missing')
          s = s.replace(needle, replacement, 1)
          s = s.replace('MCP durable project writes, including memory and change records, are disabled unless --write is explicitly requested.', 'MCP durable project writes, including memory, change, session, and finding records, are disabled unless --write is explicitly requested.', 1)
          needle = "    const action = values.shift();\n    if (action === 'start') {"
          replacement = "    const action = values.shift();\n    if (action === 'help' || hasFlag('--help') || hasFlag('-h')) {\n      console.log('Usage: cmi change <start|observe|complete|show|list|history> ...\\n\\nUse `cmi --help` for the full command surface.');\n    }\n    else if (action === 'start') {"
          if needle not in s: raise SystemExit('change help insertion point missing')
          s = s.replace(needle, replacement, 1)
          needle = "const executable = fileURLToPath(new URL('./mcp.js', import.meta.url));"
          if needle not in s: raise SystemExit('mcp-config entrypoint missing')
          s = s.replace(needle, "const executable = fileURLToPath(new URL('./mcp-entry.js', import.meta.url));", 1)
          p.write_text(s)

          p = Path('src/cli-entry.js')
          s = p.read_text()
          needle = "function print(value, formatted) { console.log(json ? JSON.stringify(value, null, 2) : formatted); }\n\ntry {\n  if (command === 'session') {"
          replacement = "function print(value, formatted) { console.log(json ? JSON.stringify(value, null, 2) : formatted); }\nfunction groupHelp(name) {\n  if (name === 'session') return 'Usage: cmi session <start|observe|status|close|show|list|handoff> ...\\n\\nTrack project work, persist findings, and produce an evidence-based handoff/next action.';\n  return 'Usage: cmi finding <list|show|state> ...\\n\\nInspect and explicitly review persistent project findings.';\n}\n\ntry {\n  if (hasFlag('--help') || hasFlag('-h') || args[0] === 'help') {\n    console.log(groupHelp(command));\n  } else if (command === 'session') {"
          if needle not in s: raise SystemExit('session/finding help insertion point missing')
          p.write_text(s.replace(needle, replacement, 1))
          PY
          cat > tests/cli-discovery.test.js <<'EOF'
          import test from 'node:test';
          import assert from 'node:assert/strict';
          import os from 'node:os';
          import path from 'node:path';
          import fs from 'node:fs/promises';
          import { spawn } from 'node:child_process';
          import { fileURLToPath } from 'node:url';

          const cli = fileURLToPath(new URL('../src/cli-entry.js', import.meta.url));

          async function fixture() {
            const root = await fs.mkdtemp(path.join(os.tmpdir(), 'cmi-cli-discovery-'));
            await fs.writeFile(path.join(root, 'package.json'), '{"type":"module"}');
            return root;
          }

          function run(args, cwd) {
            return new Promise((resolve, reject) => {
              const child = spawn(process.execPath, [cli, ...args], { cwd, stdio: ['ignore', 'pipe', 'pipe'] });
              let stdout = '';
              let stderr = '';
              child.stdout.on('data', (chunk) => { stdout += chunk; });
              child.stderr.on('data', (chunk) => { stderr += chunk; });
              child.on('error', reject);
              child.on('close', (code) => resolve({ code, stdout, stderr }));
            });
          }

          test('top-level help exposes session and finding command groups', async () => {
            const root = await fixture();
            const result = await run(['--help'], root);
            assert.equal(result.code, 0);
            assert.match(result.stdout, /cmi session <start\|observe\|status\|close\|show\|list\|handoff>/);
            assert.match(result.stdout, /cmi finding <list\|show\|state>/);
          });

          test('change, session, and finding group help exit successfully', async () => {
            const root = await fixture();
            for (const group of ['change', 'session', 'finding']) {
              const result = await run([group, '--help'], root);
              assert.equal(result.code, 0, `${group} help failed: ${result.stderr}`);
              assert.match(result.stdout, new RegExp(`cmi ${group}`));
            }
          });

          test('mcp-config uses the session-aware MCP entrypoint in safe and write modes', async () => {
            const root = await fixture();
            let result = await run(['mcp-config'], root);
            assert.equal(result.code, 0);
            let config = JSON.parse(result.stdout).mcpServers['codex-memory-intelligence'];
            assert.equal(path.basename(config.args[0]), 'mcp-entry.js');
            assert.equal(config.env.CMI_WRITE_ENABLED, '0');
            assert.equal(config.env.CMI_ALLOW_BULK_REFRESH, '0');
            result = await run(['mcp-config', '--write', '--bulk-refresh'], root);
            assert.equal(result.code, 0);
            config = JSON.parse(result.stdout).mcpServers['codex-memory-intelligence'];
            assert.equal(path.basename(config.args[0]), 'mcp-entry.js');
            assert.equal(config.env.CMI_WRITE_ENABLED, '1');
            assert.equal(config.env.CMI_ALLOW_BULK_REFRESH, '1');
          });

          test('mcp-config refuses bulk refresh without explicit write permission', async () => {
            const root = await fixture();
            const result = await run(['mcp-config', '--bulk-refresh'], root);
            assert.equal(result.code, 1);
            assert.match(result.stderr, /requires --write/i);
          });
          EOF
          rm -f .github/workflows/apply-experiential-fixes.yml .github/workflows/apply-experiential-fixes-v2.yml
      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'CMI audit automation'
          git config user.email 'audit@users.noreply.github.com'
          git add src/cli.js src/cli-entry.js tests/cli-discovery.test.js .github/workflows
          git diff --cached --check
          git commit -m 'fix: repair CLI discovery and session-aware MCP config'
          git push origin HEAD:staging/v08-experiential-fixes
