name: Apply v0.8 experiential product fixes

on:
  push:
    branches:
      - audit/v08-experiential-20260807

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'chore: stage experiential audit product fixes'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Patch confirmed CLI and MCP-config defects
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('src/cli.js')
          s = p.read_text()
          s = s.replace(
            "  cmi change history [query] [--limit N] [--json]\\n  cmi remember <fact|decision|mistake> <text> [--source path ...]",
            "  cmi change history [query] [--limit N] [--json]\\n  cmi session <start|observe|status|close|show|list|handoff> ...\\n  cmi finding <list|show|state> ...\\n  cmi remember <fact|decision|mistake> <text> [--source path ...]"
          )
          s = s.replace(
            "MCP durable project writes, including memory and change records, are disabled unless --write is explicitly requested.",
            "MCP durable project writes, including memory, change, session, and finding records, are disabled unless --write is explicitly requested."
          )
          old = """    const action = values.shift();
    if (action === 'start') {"""
          new = """    const action = values.shift();
    if (action === 'help' || hasFlag('--help') || hasFlag('-h')) {
      console.log('Usage: cmi change <start|observe|complete|show|list|history> ...\\n\\nUse `cmi --help` for the full command surface.');
    }
    else if (action === 'start') {"""
          if old not in s:
              raise SystemExit('change dispatch snippet not found')
          s = s.replace(old, new, 1)
          old = "const executable = fileURLToPath(new URL('./mcp.js', import.meta.url));"
          new = "const executable = fileURLToPath(new URL('./mcp-entry.js', import.meta.url));"
          if old not in s:
              raise SystemExit('mcp-config executable snippet not found')
          s = s.replace(old, new, 1)
          p.write_text(s)

          p = Path('src/cli-entry.js')
          s = p.read_text()
          marker = "function print(value, formatted) { console.log(json ? JSON.stringify(value, null, 2) : formatted); }\n\ntry {"
          replacement = """function print(value, formatted) { console.log(json ? JSON.stringify(value, null, 2) : formatted); }
function groupHelp(name) {
  if (name === 'session') return 'Usage: cmi session <start|observe|status|close|show|list|handoff> ...\\n\\nTrack project work, persist findings, and produce an evidence-based handoff/next action.';
  return 'Usage: cmi finding <list|show|state> ...\\n\\nInspect and explicitly review persistent project findings.';
}

try {
  if (hasFlag('--help') || hasFlag('-h') || args[0] === 'help') {
    console.log(groupHelp(command));
  } else"""
          if marker not in s:
              raise SystemExit('cli-entry help insertion point not found')
          s = s.replace(marker, replacement, 1)
          p.write_text(s)
          PY
          rm -f .github/workflows/apply-v08-experiential-product-fixes.yml
      - name: Commit staged product fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'CMI audit automation'
          git config user.email 'audit@users.noreply.github.com'
          git add src/cli.js src/cli-entry.js .github/workflows/apply-v08-experiential-product-fixes.yml
          git diff --cached --check
          git commit -m 'fix: repair v0.8 CLI discovery and MCP config'
          git push origin HEAD:audit/v08-experiential-20260807
