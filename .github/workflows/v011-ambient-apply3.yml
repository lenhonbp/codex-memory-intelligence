name: Apply v0.11 ambient source patch

on:
  push:
    branches:
      - feat/v0.11-ambient-agent-intelligence
    paths:
      - .github/workflows/v011-ambient-apply3.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply source patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'expected source fragment not found in {path}: {old[:120]!r}')
              p.write_text(text.replace(old, new, 1))

          Path('src/activation.js').write_text(r'''import fs from 'node:fs/promises';
          import path from 'node:path';
          import { initProject, scanProject } from './core.js';

          const MAX_INTEGRATION_BYTES = 1_000_000;
          const AGENTS_BEGIN = '<!-- cmi-managed:start -->';
          const AGENTS_END = '<!-- cmi-managed:end -->';
          const CODEX_BEGIN = '# cmi-managed:start';
          const CODEX_END = '# cmi-managed:end';

          const AGENTS_BLOCK = `${AGENTS_BEGIN}
          ## CMI ambient project intelligence

          CMI is activated for this project. The user may give short, natural requests and does not need to mention CMI or restate its workflow.

          For every substantive repository task:
          - Get a CMI ambient task brief early, using the user's request verbatim when practical. Prefer the MCP tool \`get_ambient_task_brief\`; if MCP is unavailable, use \`npx cmi ambient "<user request>" --json\`.
          - Treat CMI intent classification, boundaries, impact, history, findings, and recommendations as advisory evidence, not authorization or product truth.
          - For implementation/refactor/fix work, start a CMI work session and a Change Intelligence record before editing when write tools are available; inspect relevant context/impact; observe actual changed paths; run the project's real verification; then complete the change record and finalize the session.
          - For investigation/review work, retrieve context first and use a work session when the work is substantial. Do not create a change record unless edits actually begin.
          - For continuation requests such as "continue", "resume", or "làm tiếp", read the latest CMI handoff and re-check current repository evidence instead of asking the user to reconstruct known state.
          - Do not broaden the user's task merely because CMI recommends additional work. Surface material P0/P1 evidence, but keep user intent in control.
          - Never promote inferred advice, memory-gap suggestions, session candidates, or change-learning candidates into durable project truth without explicit review.
          - Never claim a test/build/deploy succeeded unless it was actually run and observed through the agent's normal environment.
          - Before ending substantial work, finalize the CMI session when possible and surface unresolved P0/P1 findings plus the highest-priority evidence-based next action.

          If CMI is unavailable or blocked, continue only with evidence you can actually establish and state the limitation. Do not ask the user to rewrite a short prompt into a CMI-specific prompt.
          ${AGENTS_END}`;

          const CODEX_BLOCK = `${CODEX_BEGIN}
          [mcp_servers.cmi]
          command = "npx"
          args = ["--no-install", "cmi-mcp"]
          cwd = "."
          env = { CMI_WRITE_ENABLED = "1" }
          ${CODEX_END}`;

          function normalizedManagedContent(existing, begin, end, block, label) {
            const text = existing ?? '';
            const start = text.indexOf(begin);
            const finish = text.indexOf(end);
            if ((start >= 0) !== (finish >= 0) || (start >= 0 && finish < start)) throw new Error(`${label} contains a partial or malformed CMI managed block. Repair it explicitly before activation.`);
            if (start >= 0) {
              const after = finish + end.length;
              return `${text.slice(0, start)}${block}${text.slice(after)}`;
            }
            const prefix = text && !text.endsWith('\n') ? `${text}\n` : text;
            return `${prefix}${prefix ? '\n' : ''}${block}\n`;
          }

          async function readIntegrationFile(root, relative) {
            const target = path.join(root, relative);
            let stat;
            try { stat = await fs.lstat(target); }
            catch (error) { if (error?.code === 'ENOENT') return null; throw error; }
            if (stat.isSymbolicLink() || !stat.isFile()) throw new Error(`${relative} must be a regular non-symlink file before CMI can manage it.`);
            if (stat.size > MAX_INTEGRATION_BYTES) throw new Error(`${relative} exceeds the bounded CMI integration size limit.`);
            return fs.readFile(target, 'utf8');
          }

          async function atomicWrite(root, relative, content) {
            const target = path.join(root, relative);
            await fs.mkdir(path.dirname(target), { recursive: true });
            const temporary = `${target}.${process.pid}.cmi-activate.tmp`;
            await fs.writeFile(temporary, content, { encoding: 'utf8', mode: 0o600 });
            try { await fs.rename(temporary, target); }
            catch (error) { await fs.rm(temporary, { force: true }).catch(() => {}); throw error; }
          }

          async function mergeAgents(root) {
            const existing = await readIntegrationFile(root, 'AGENTS.md');
            const next = normalizedManagedContent(existing, AGENTS_BEGIN, AGENTS_END, AGENTS_BLOCK, 'AGENTS.md');
            if (next !== existing) await atomicWrite(root, 'AGENTS.md', next);
            return { path: 'AGENTS.md', changed: next !== existing, managed: true };
          }

          async function mergeCodexConfig(root) {
            const existing = await readIntegrationFile(root, '.codex/config.toml');
            const text = existing ?? '';
            if (/^\s*\[mcp_servers\.cmi\]\s*$/m.test(text) && !text.includes(CODEX_BEGIN)) {
              throw new Error('.codex/config.toml already contains an unmanaged [mcp_servers.cmi] section. CMI will not overwrite it; reconcile that configuration explicitly first.');
            }
            const next = normalizedManagedContent(existing, CODEX_BEGIN, CODEX_END, CODEX_BLOCK, '.codex/config.toml');
            if (next !== existing) await atomicWrite(root, '.codex/config.toml', next);
            return { path: '.codex/config.toml', changed: next !== existing, managed: true, writeEnabled: true };
          }

          export async function activateProject(root, options = {}) {
            const resolvedRoot = path.resolve(root);
            const agent = String(options.agent || 'codex').trim().toLowerCase();
            if (!['codex', 'generic'].includes(agent)) throw new Error('Activation agent must be codex or generic.');
            await initProject(resolvedRoot);
            const integrations = [];
            if (agent === 'codex') {
              integrations.push(await mergeAgents(resolvedRoot));
              integrations.push(await mergeCodexConfig(resolvedRoot));
            }
            const scan = await scanProject(resolvedRoot);
            return {
              schemaVersion: 1,
              activated: true,
              agent,
              integrations,
              scan: { files: scan.files, sourceFiles: scan.graph.sourceFiles, symbols: scan.graph.symbols, workspaces: scan.workspaces.count },
              usage: agent === 'codex' ? 'Start a new Codex run/session, then talk to Codex normally. Short prompts are sufficient; CMI workflow instructions are project-managed.' : 'Use CMI CLI/MCP from the external agent integration. Generic activation cannot force an arbitrary client to consume CMI.',
              limitations: agent === 'codex'
                ? ['Codex builds its project instruction chain at run/session start, so first activation requires a new Codex run/session before the managed AGENTS.md block is guaranteed to apply.', 'Project-scoped .codex/config.toml is consumed only when the project is trusted by the client.', 'CMI cannot force a client that ignores project instructions or MCP to follow the integration contract.']
                : ['Generic activation initializes/scans CMI but cannot configure every external AI client automatically.'],
              policy: 'Activation configures supported integration surfaces and generated intelligence. It does not promote inferred advice or memory candidates into durable project truth.',
            };
          }

          export function formatActivation(result) {
            const items = result.integrations.length ? result.integrations.map((item) => `- ${item.path}: ${item.changed ? 'updated' : 'already current'}`).join('\n') : '- No agent-specific files were changed.';
            return `CMI activated for ${result.agent}.\n${items}\nProject intelligence: ${result.scan.sourceFiles} source files · ${result.scan.symbols} symbols · ${result.scan.workspaces} workspace(s)\n\n${result.usage}`;
          }
          '''.replace('\n          ', '\n').lstrip())

          Path('src/ambient-intelligence.js').write_text(r'''import { status as getProjectStatus } from './core.js';
          import { getRepositoryBaseline, prepareChangeBrief } from './advisor.js';
          import { buildContextPack } from './search.js';
          import { getSessionHandoff } from './session-intelligence.js';

          const CONTINUE = /(?:\blàm\s+tiếp\b|\btiếp\s+tục\b|\bresume\b|\bcontinue\b|\bpick\s+up\b|\bhôm\s+qua\b|\blast\s+(?:time|session)\b)/iu;
          const MUTATE = /(?:\bsửa\b|\bfix\b|\bthêm\b|\badd\b|\bimplement\b|\btriển\s+khai\b|\btạo\b|\bcreate\b|\bupdate\b|\bcập\s+nhật\b|\brefactor\b|\bđổi\b|\bchange\b|\bxóa\b|\bremove\b|\blàm\s+cho\b|\bmake\b)/iu;
          const REVIEW = /(?:\bổn\s+chưa\b|\breview\b|\baudit\b|\bđánh\s+giá\b|\bcó\s+lỗi\s+gì\b|\bwhat(?:'s|\s+is)?\s+wrong\b|\bis\s+this\s+(?:ok|okay|good)\b)/iu;
          const INVESTIGATE = /(?:\bkiểm\s+tra\b|\binvestigat\w*\b|\bdebug\b|\btìm\s+hiểu\b|\bphân\s+tích\b|\banaly[sz]e\b|\btại\s+sao\b|\bwhy\b)/iu;

          export function classifyAmbientIntent(request) {
            const text = String(request || '').trim();
            if (!text) return { intent: 'unknown', confidence: 'low', evidence: [] };
            if (CONTINUE.test(text)) return { intent: 'continue', confidence: 'high', evidence: ['request-continuation-language'] };
            if (REVIEW.test(text)) return { intent: 'review', confidence: 'medium', evidence: ['request-review-language'] };
            if (MUTATE.test(text)) return { intent: 'mutate', confidence: 'medium', evidence: ['request-mutation-language'] };
            if (INVESTIGATE.test(text)) return { intent: 'investigate', confidence: 'medium', evidence: ['request-investigation-language'] };
            return { intent: 'unknown', confidence: 'low', evidence: ['no-deterministic-intent-rule-matched'] };
          }

          async function optionalContext(root, request, project) {
            if (!project?.graphHealth?.current) return null;
            try {
              const pack = await buildContextPack(root, request, 8, { stalePolicy: 'demote' });
              return { summary: pack.summary || null, recommendedFiles: pack.recommendedFiles || [], affectedWorkspaces: pack.affectedWorkspaces || [], results: (pack.results || []).slice(0, 8), health: pack.health || null };
            } catch { return null; }
          }

          async function optionalHandoff(root) {
            try { return await getSessionHandoff(root, 'latest'); }
            catch { return null; }
          }

          function workflowFor(intent, context) {
            if (intent === 'continue') return ['Read the latest CMI handoff when available and re-check current repository evidence.', 'Continue the recorded objective only when it still matches the user request.', 'Address relevant P0/P1 evidence before unrelated work unless the user changes priority.'];
            if (intent === 'mutate') return ['Start a CMI work session and Change Intelligence record before editing when durable writes are enabled.', 'Use task context and impact evidence before changing shared files or symbols.', 'After editing, run real project verification, observe actual changed paths, complete the change record, and finalize the session.'];
            if (intent === 'review') return ['Use CMI context, current Git state, decisions, and lessons as review evidence.', 'Do not create a change record unless edits actually begin.', 'Use a work session when the review is substantial or leaves durable findings.'];
            if (intent === 'investigate') return ['Use CMI context and relevant history before broad exploration.', 'Use a work session for substantial investigation; do not create a change record unless edits begin.', 'Preserve unresolved blockers/questions for continuation instead of promoting hypotheses into durable truth.'];
            return context?.recommendedFiles?.length ? ['Use the retrieved evidence to understand the request, but keep the user's intent in control.', 'Do not infer permission to edit or broaden scope solely from CMI advice.'] : ['CMI has insufficient evidence to prescribe a specialized workflow. Follow the user request conservatively and establish project evidence as needed.'];
          }

          export async function buildAmbientTaskBrief(root, request) {
            const normalized = String(request || '').trim();
            if (!normalized) throw new Error('Ambient task request cannot be empty.');
            const classification = classifyAmbientIntent(normalized);
            const [project, repository] = await Promise.all([getProjectStatus(root), getRepositoryBaseline(root)]);
            const context = await optionalContext(root, normalized, project);
            let preparation = null;
            if (classification.intent === 'mutate' && project?.graphHealth?.current) {
              try { preparation = await prepareChangeBrief(root, normalized, { limit: 10, depth: 3 }); } catch {}
            }
            const handoff = classification.intent === 'continue' ? await optionalHandoff(root) : null;
            return {
              schemaVersion: 1,
              request: normalized,
              classification,
              project: { initialized: project.initialized, healthy: project.healthy, evidenceHealth: project.evidenceHealth, graphHealth: project.graphHealth, memoryHealth: project.memoryHealth },
              repository,
              context,
              preparation,
              handoff,
              workflow: workflowFor(classification.intent, context),
              policy: 'Intent classification and workflow hints are deterministic advisory routing. They do not authorize edits, execute project commands, or turn inferred/candidate knowledge into durable truth.',
            };
          }

          export function formatAmbientTaskBrief(result) {
            const files = result.context?.recommendedFiles?.slice(0, 8) || [];
            return `# CMI ambient task brief\n\nRequest: ${result.request}\nIntent: ${result.classification.intent} · confidence ${result.classification.confidence}\nProject evidence: ${result.project.evidenceHealth?.state || 'unknown'}\nGit product worktree: ${result.repository.available ? (result.repository.clean ? 'clean' : 'dirty') : 'unavailable'}${result.repository.available && result.repository.rawClean === false && result.repository.clean ? ' · raw Git includes CMI-internal state' : ''}\n\n## Relevant files\n${files.length ? files.map((file) => `- ${file}`).join('\n') : '- No task-relevant files retrieved'}\n\n## Workflow\n${result.workflow.map((item) => `- ${item}`).join('\n')}\n\n${result.policy}`;
          }
          '''.replace('\n          ', '\n').lstrip())

          replace_once('src/core.js', """    `- Source files analyzed: ${graph.summary.sourceFiles}`,
              `- Parsed this scan: ${graph.summary.parsedFiles}`,
              `- Reused from previous scan: ${graph.summary.reusedFiles}`,
              `- Local import edges: ${graph.summary.localEdges}`,
              `- Cross-workspace edges: ${graph.summary.crossWorkspaceEdges}`,
              `- Symbols indexed: ${graph.summary.symbols}`,
              `- External dependencies observed: ${graph.summary.externalDependencies}`,
              `- Unresolved local imports: ${graph.summary.unresolvedImports}`,
              `- Scan duration: ${graph.summary.durationMs} ms`,""".replace('              ', '  '), """    `- Source files analyzed: ${graph.summary.sourceFiles}`,
              `- Local import edges: ${graph.summary.localEdges}`,
              `- Cross-workspace edges: ${graph.summary.crossWorkspaceEdges}`,
              `- Symbols indexed: ${graph.summary.symbols}`,
              `- External dependencies observed: ${graph.summary.externalDependencies}`,
              `- Non-code local dependencies observed: ${graph.summary.nonCodeDependencies || 0}`,
              `- Unresolved local imports: ${graph.summary.unresolvedImports}`,""".replace('              ', '  '))
          replace_once('src/core.js', "return `# Project Architecture\\n\\nGenerated: ${manifest.generatedAt}\\nIndex: \\`${manifest.hash.slice(0, 12)}\\`", "return `# Project Architecture\\n\\nIndex: \\`${manifest.hash.slice(0, 12)}\\`")
          replace_once('src/core.js', "snapshots: snapshots.length,", "snapshots: snapshots.filter((name) => name.endsWith('.json')).length,")

          replace_once('src/advisor.js', """    const porcelain = await runGit(resolvedRoot, ['status', '--porcelain=v1', '-z', '--untracked-files=normal']);
              const allChanges = parseGitStatusPorcelainZ(porcelain).filter((item) => {
                const cmiInternal = isCmiInternalPath(item.path) || isCmiInternalPath(item.originalPath);
                return !(cmiInternal && isUntrackedGitStatus(item.status));
              });""".replace('              ', '    '), """    const porcelain = await runGit(resolvedRoot, ['status', '--porcelain=v1', '-z', '--untracked-files=normal']);
              const rawChanges = parseGitStatusPorcelainZ(porcelain);
              const allChanges = rawChanges.filter((item) => {
                const cmiInternal = isCmiInternalPath(item.path) || isCmiInternalPath(item.originalPath);
                return !(cmiInternal && isUntrackedGitStatus(item.status));
              });
              const cmiInternalChangesOmitted = rawChanges.length - allChanges.length;""".replace('              ', '    '))
          replace_once('src/advisor.js', """      clean: allChanges.length === 0,
                  changes: bounded(allChanges, 200),
                  changesTruncated: allChanges.length > 200,""".replace('                  ', '      '), """      clean: allChanges.length === 0,
                  changes: bounded(allChanges, 200),
                  changesTruncated: allChanges.length > 200,
                  rawClean: rawChanges.length === 0,
                  rawChanges: bounded(rawChanges, 200),
                  rawChangesTruncated: rawChanges.length > 200,
                  cmiInternalChangesOmitted,""".replace('                  ', '      '))
          replace_once('src/advisor.js', "if (memory.coverage.relevantDurableEntries === 0) risks.push({ id: 'memory-gap'", "if (memory.relatedFiles.length > 0 && memory.coverage.relevantDurableEntries === 0) risks.push({ id: 'memory-gap'")
          replace_once('src/advisor.js', """function buildVerification({ boundaries, topics, memory }) {
            const items = [
              { id: 'targeted-tests', title: 'Targeted regression tests', guidance: 'Run the smallest test set that directly covers the changed behavior and every modified boundary.', evidence: memory.relatedFiles.slice(0, 8) },
            ];""", """function buildVerification({ boundaries, topics, memory }) {
            const items = [];
            if (memory.relatedFiles.length || boundaries.length || topics.length) items.push(
              { id: 'targeted-tests', title: 'Targeted regression tests', guidance: 'Run the smallest test set that directly covers the changed behavior and every modified boundary.', evidence: memory.relatedFiles.slice(0, 8) },
            );""")
          replace_once('src/advisor.js', """  const changes = result.clean ? '- None' : result.changes.map((item) => `- ${item.status} ${item.path}${item.originalPath ? ` (from ${item.originalPath})` : ''}`).join('\\n');
            return `# Repository baseline\\n\\n- Branch: ${result.branch}\\n- HEAD: ${result.head || 'unborn'}\\n- Worktree: ${result.clean ? 'clean' : 'dirty'}\\n- Project path: ${result.projectPath}${sync}\\n- Latest commit: ${result.commit?.subject || 'none'}\\n\\n## Changes\\n${changes}`;""", """  const changes = result.clean ? '- None' : result.changes.map((item) => `- ${item.status} ${item.path}${item.originalPath ? ` (from ${item.originalPath})` : ''}`).join('\\n');
            const raw = result.rawClean === undefined ? '' : `\\n- Raw Git worktree: ${result.rawClean ? 'clean' : 'dirty'}${result.cmiInternalChangesOmitted ? ` · ${result.cmiInternalChangesOmitted} untracked CMI-internal change(s) omitted from product scope` : ''}`;
            return `# Repository baseline\\n\\n- Branch: ${result.branch}\\n- HEAD: ${result.head || 'unborn'}\\n- Product worktree: ${result.clean ? 'clean' : 'dirty'}${raw}\\n- Project path: ${result.projectPath}${sync}\\n- Latest commit: ${result.commit?.subject || 'none'}\\n\\n## Product changes\\n${changes}`;""")

          replace_once('src/graph.js', "const sourcePaths = new Set(sources.map((file) => file.path));", "const sourcePaths = new Set(sources.map((file) => file.path));\n  const allFilePaths = new Set(fileRecords.map((file) => file.path));")
          replace_once('src/graph.js', """function resolveFromCandidates(candidates, sourcePaths) {
            return candidates.find((candidate) => sourcePaths.has(candidate)) || null;
          }
          """, """function resolveFromCandidates(candidates, sourcePaths) {
            return candidates.find((candidate) => sourcePaths.has(candidate)) || null;
          }

          function resolveLocalNonCodeImport(fromFile, specifier, allFilePaths) {
            if (!specifier.startsWith('.')) return null;
            const clean = specifier.split(/[?#]/, 1)[0];
            const base = slash(path.posix.normalize(path.posix.join(path.posix.dirname(fromFile), clean)));
            const candidates = [base];
            if (!path.posix.extname(base)) candidates.push(`${base}.css`, `${base}.scss`, `${base}.sass`, `${base}.less`, `${base}.json`);
            return candidates.find((candidate) => allFilePaths.has(candidate)) || null;
          }
          """)
          replace_once('src/graph.js', """    node.imports = node.rawImports.map((specifier) => {
                const resolved = resolveImport(node.path, specifier, sourcePaths, resolvers);
                const localSyntax = isLocalSyntax(node.path, specifier, resolvers);
                return { specifier, resolved, external: !resolved && !localSyntax, unresolved: !resolved && localSyntax };
              });""".replace('                ', '    '), """    node.imports = node.rawImports.map((specifier) => {
                const resolved = resolveImport(node.path, specifier, sourcePaths, resolvers);
                const localSyntax = isLocalSyntax(node.path, specifier, resolvers);
                const nonCodeTarget = !resolved && localSyntax ? resolveLocalNonCodeImport(node.path, specifier, allFilePaths) : null;
                const external = !resolved && !localSyntax;
                const unresolved = !resolved && localSyntax && !nonCodeTarget;
                return { specifier, resolved, ...(nonCodeTarget ? { nonCodeTarget } : {}), external, unresolved, dependencyKind: resolved ? 'source-local' : nonCodeTarget ? 'non-code-local' : external ? 'external' : 'unresolved-local' };
              });""".replace('                ', '    '))
          replace_once('src/graph.js', "const unresolvedImports = nodes.reduce((sum, node) => sum + node.imports.filter((item) => item.unresolved).length, 0);", "const unresolvedImports = nodes.reduce((sum, node) => sum + node.imports.filter((item) => item.unresolved).length, 0);\n  const nonCodeDependencies = nodes.reduce((sum, node) => sum + node.imports.filter((item) => item.nonCodeTarget).length, 0);")
          replace_once('src/graph.js', "      unresolvedImports,\n      symbols: symbolCount,", "      unresolvedImports,\n      nonCodeDependencies,\n      symbols: symbolCount,")

          replace_once('src/session-intelligence.js', "const SESSION_DIR = 'sessions';", "const SESSION_DIR = 'sessions';\nconst ACTIVE_SESSION_DIR = 'snapshots/active-sessions';")
          replace_once('src/session-intelligence.js', "function sessionPath(root, id) { return path.join(sessionsDirectory(root), `${id}.json`); }", "function sessionPath(root, id) { return path.join(sessionsDirectory(root), `${id}.json`); }\nfunction activeSessionsDirectory(root) { return path.join(root, MEMORY_DIR, ACTIVE_SESSION_DIR); }\nfunction activeSessionPath(root, id) { return path.join(activeSessionsDirectory(root), `${id}.json`); }")
          replace_once('src/session-intelligence.js', """  await safeEnsureMemoryDir(root, SESSION_DIR);
            await safeEnsureMemoryDir(root, 'snapshots');""", """  await safeEnsureMemoryDir(root, SESSION_DIR);
            await safeEnsureMemoryDir(root, 'snapshots');
            await safeEnsureMemoryDir(root, ACTIVE_SESSION_DIR);""")
          replace_once('src/session-intelligence.js', """async function writeSession(root, record) {
            if (!validateSessionRecord(record)) throw new Error('Invalid session record.');
            const lockTarget = sessionLockPath(root, record.id);
            const lock = await acquireLock(lockTarget);
            try { await atomicJsonWrite(sessionPath(root, record.id), record); }
            finally { await releaseLock(lockTarget, lock); }
          }
          async function readSessionRecords(root) {
            await ensureStorage(root);
            const names = await fs.readdir(sessionsDirectory(root)).catch(() => []);
            const candidates = names.filter((name) => /^[0-9a-f-]+\\.json$/i.test(name));
            const records = [];
            let invalidRecords = 0;
            for (const name of candidates.slice(0, MAX_RECORDS)) {
              const record = await safeReadJson(path.join(sessionsDirectory(root), name), validateSessionRecord);
              if (record) records.push(record); else invalidRecords += 1;
            }
            records.sort((a, b) => String(b.updatedAt).localeCompare(String(a.updatedAt)));
            return { records, invalidRecords, truncated: candidates.length > MAX_RECORDS };
          }""", """async function writeSession(root, record) {
            if (!validateSessionRecord(record)) throw new Error('Invalid session record.');
            const lockTarget = sessionLockPath(root, record.id);
            const lock = await acquireLock(lockTarget);
            try {
              const target = record.status === 'active' ? activeSessionPath(root, record.id) : sessionPath(root, record.id);
              await atomicJsonWrite(target, record);
              if (record.status === 'active') await fs.rm(sessionPath(root, record.id), { force: true }).catch(() => {});
              else await fs.rm(activeSessionPath(root, record.id), { force: true }).catch(() => {});
            } finally { await releaseLock(lockTarget, lock); }
          }
          async function readSessionRecords(root) {
            await ensureStorage(root);
            const sources = [sessionsDirectory(root), activeSessionsDirectory(root)];
            const candidates = [];
            for (const directory of sources) {
              const names = await fs.readdir(directory).catch(() => []);
              for (const name of names.filter((item) => /^[0-9a-f-]+\\.json$/i.test(item))) candidates.push({ directory, name });
            }
            const byId = new Map();
            let invalidRecords = 0;
            for (const item of candidates.slice(0, MAX_RECORDS)) {
              const record = await safeReadJson(path.join(item.directory, item.name), validateSessionRecord);
              if (!record) { invalidRecords += 1; continue; }
              const previous = byId.get(record.id);
              if (!previous || String(record.updatedAt).localeCompare(String(previous.updatedAt)) >= 0) byId.set(record.id, record);
            }
            const records = [...byId.values()].sort((a, b) => String(b.updatedAt).localeCompare(String(a.updatedAt)));
            return { records, invalidRecords, truncated: candidates.length > MAX_RECORDS };
          }""")
          replace_once('src/session-intelligence.js', """function sessionRepositoryBaseline(repository) {
            if (!repository?.available) return repository;
            const projectChanges = [];
            let cmiInternalChangesOmitted = 0;
            for (const item of repository.changes || []) {
              if (isCmiInternalPath(item.path)) cmiInternalChangesOmitted += 1;
              else projectChanges.push(item);
            }
            return { ...repository, projectClean: projectChanges.length === 0, projectChanges: bounded(projectChanges, 200), cmiInternalChangesOmitted };
